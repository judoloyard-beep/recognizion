
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hand Tracking</title>

<style>
body {
  margin: 0;
  background: #090914;
  color: white;
  font-family: Arial;
  text-align: center;
}
h2 { color: #b58aff; }
video, canvas {
  width: 95%;
  max-width: 500px;
  border-radius: 15px;
}
.camera {
  position: relative;
  margin: auto;
}
canvas {
  position: absolute;
  left: 2.5%;
  top: 0;
}
button {
  padding: 14px 25px;
  background: #8b5cf6;
  color: white;
  border: 0;
  border-radius: 12px;
  margin: 15px;
}
</style>
</head>

<body>

<h2>🖐️ Hand Recognition</h2>
<p id="status">tekan mulai untuk membuka kamera</p>

<div class="camera">
  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>
</div>

<br>
<button onclick="start()">MULAI KAMERA</button>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

<script>
const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const statusText = document.getElementById("status");

const hands = new Hands({
  locateFile: file =>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
});

hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.6,
  minTrackingConfidence: 0.6
});

hands.onResults(results => {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (results.multiHandLandmarks.length > 0) {
    statusText.innerText =
      "🖐️ tangan terdeteksi: " +
      results.multiHandLandmarks.length;

    for (const landmarks of results.multiHandLandmarks) {
      for (const point of landmarks) {
        ctx.beginPath();
        ctx.arc(
          point.x * canvas.width,
          point.y * canvas.height,
          6, 0, 2 * Math.PI
        );
        ctx.fillStyle = "#a78bfa";
        ctx.fill();
      }
    }
  } else {
    statusText.innerText = "tangan belum terdeteksi";
  }
});

async function start() {
  try {
    const camera = new Camera(video, {
      onFrame: async () => {
        await hands.send({image: video});
      },
      width: 640,
      height: 480
    });

    await camera.start();
    statusText.innerText = "kamera aktif, tunjukkan tangan!";
  } catch (error) {
    statusText.innerText = "kamera gagal dibuka: " + error.message;
  }
}
</script>

</body>
</html>
