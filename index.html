HTML

<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SENKO UNIVERSE V6</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#050510;color:white;
  font-family:Arial,sans-serif;overflow:hidden;
}
#scene{position:fixed;inset:0}
video{display:none}
.panel{
  position:fixed;top:18px;left:50%;
  transform:translateX(-50%);
  width:92%;max-width:480px;text-align:center;
  z-index:5;pointer-events:none;
}
h1{
  font-size:22px;letter-spacing:4px;
  color:#d9b5ff;
  text-shadow:0 0 15px #9d42ff;
}
#status{font-size:12px;color:#b9a6d8;margin-top:8px}
#gesture{
  margin-top:13px;font-size:17px;
  font-weight:bold;color:#fff;
  text-shadow:0 0 12px #b44aff;
}
#hint{
  position:fixed;bottom:95px;left:50%;
  transform:translateX(-50%);
  width:90%;text-align:center;
  font-size:12px;color:#c8b9e8;
  line-height:1.7;z-index:5;
  pointer-events:none;
}
.controls{
  position:fixed;bottom:20px;left:0;right:0;
  display:flex;justify-content:center;z-index:10;
}
button{
  border:1px solid #a44cff;
  background:#170d2c;color:white;
  padding:13px 25px;border-radius:30px;
  font-weight:bold;box-shadow:0 0 18px #852dca66;
}
#cameraPreview{
  position:fixed;right:12px;top:12px;
  width:90px;height:68px;object-fit:cover;
  border:1px solid #a44cff;border-radius:12px;
  transform:scaleX(-1);opacity:.55;z-index:4;
}
#flash{
  position:fixed;inset:0;pointer-events:none;
  background:#b45aff;opacity:0;z-index:3;
}
</style>
</head>

<body>
<div id="scene"></div>
<video id="video" autoplay playsinline muted></video>
<video id="cameraPreview" autoplay playsinline muted></video>
<div id="flash"></div>

<div class="panel">
  <h1>SENKO UNIVERSE</h1>
  <div id="status">KAMERA BELUM AKTIF</div>
  <div id="gesture">✦ SIAPKAN TANGANMU ✦</div>
</div>

<div id="hint">
  🤙 SHAKA: PORTAL<br>
  🤘 ROCK: PETIR<br>
  👍 THUMBS UP: ENERGY ORB<br>
  ✌️ PEACE: HEART<br>
  ✊ FIST: COLLAPSE
</div>

<div class="controls">
  <button id="start">AKTIFKAN KAMERA</button>
</div>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import {FilesetResolver,HandLandmarker}
from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const sceneEl=document.getElementById("scene");
const video=document.getElementById("video");
const preview=document.getElementById("cameraPreview");
const statusEl=document.getElementById("status");
const gestureEl=document.getElementById("gesture");
const flash=document.getElementById("flash");

let renderer,scene,camera,particles,geometry;
let handLandmarker=null,stream=null;
let running=false,lastVideoTime=-1;
let currentMode="universe";
let targetMode="universe";
let stableCount=0,lastCandidate="";
let lastChange=0;
let frame=0;

const COUNT=2200;
const positions=new Float32Array(COUNT*3);
const targets=new Float32Array(COUNT*3);

const colors={
 universe:0xb66cff,
 portal:0x39eaff,
 lightning:0x9b75ff,
 orb:0xffc45e,
 heart:0xff4caa,
 fist:0x9c5bff
};

function initThree(){
  scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x050510,0.025);

  camera=new THREE.PerspectiveCamera(
    65,innerWidth/innerHeight,0.1,100
  );
  camera.position.z=8;

  renderer=new THREE.WebGLRenderer({
    antialias:false,alpha:true
  });
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
  renderer.setSize(innerWidth,innerHeight);
  sceneEl.appendChild(renderer.domElement);

  for(let i=0;i<COUNT;i++){
    const p=randomSphere(2.1);
    positions[i*3]=p.x;
    positions[i*3+1]=p.y;
    positions[i*3+2]=p.z;
  }

  geometry=new THREE.BufferGeometry();
  geometry.setAttribute(
    "position",new THREE.BufferAttribute(positions,3)
  );

  const material=new THREE.PointsMaterial({
    color:colors.universe,size:0.035,
    transparent:true,opacity:.9,
    blending:THREE.AdditiveBlending,
    depthWrite:false
  });

  particles=new THREE.Points(geometry,material);
  scene.add(particles);

  // bintang latar
  const starGeo=new THREE.BufferGeometry();
  const starPos=[];
  for(let i=0;i<700;i++){
    starPos.push(
      (Math.random()-.5)*35,
      (Math.random()-.5)*25,
      (Math.random()-.5)*18-5
    );
  }
  starGeo.setAttribute(
    "position",new THREE.Float32BufferAttribute(starPos,3)
  );
  const stars=new THREE.Points(
    starGeo,
    new THREE.PointsMaterial({
      color:0x9e82ca,size:.025,transparent:true,opacity:.65
    })
  );
  scene.add(stars);

  createRing();
  createLightning();
  createCursor();

  animate();
}

let ring,ring2,orbMesh,lightning,cursor;

function createRing(){
  ring=new THREE.Mesh(
    new THREE.TorusGeometry(1.7,.025,8,100),
    new THREE.MeshBasicMaterial({
      color:0x55ddff,transparent:true,opacity:.9
    })
  );
  ring2=new THREE.Mesh(
    new THREE.TorusGeometry(1.35,.018,8,100),
    new THREE.MeshBasicMaterial({
      color:0xc16aff,transparent:true,opacity:.7
    })
  );
  scene.add(ring,ring2);

  orbMesh=new THREE.Mesh(
    new THREE.SphereGeometry(.8,24,24),
    new THREE.MeshBasicMaterial({
      color:0xffc45e,wireframe:true,
      transparent:true,opacity:.5
    })
  );
  scene.add(orbMesh);
}

function createLightning(){
  const pts=[];
  for(let i=0;i<60;i++){
    pts.push(new THREE.Vector3(0,0,0));
  }
  const geo=new THREE.BufferGeometry().setFromPoints(pts);
  lightning=new THREE.Line(
    geo,
    new THREE.LineBasicMaterial({
      color:0xc18aff,transparent:true,opacity:.9
    })
  );
  scene.add(lightning);
}

function createCursor(){
  cursor=new THREE.Mesh(
    new THREE.TorusGeometry(.22,.018,8,40),
    new THREE.MeshBasicMaterial({color:0x52eaff})
  );
  cursor.visible=false;
  scene.add(cursor);
}

function randomSphere(radius){
  const u=Math.random()*2-1;
  const a=Math.random()*Math.PI*2;
  const r=radius*Math.cbrt(Math.random());
  return new THREE.Vector3(
    r*Math.sqrt(1-u*u)*Math.cos(a),
    r*Math.sqrt(1-u*u)*Math.sin(a),
    r*u
  );
}

function heartPoint(t){
  return new THREE.Vector3(
    .16*Math.pow(Math.sin(t),3)*7,
    (13*Math.cos(t)-5*Math.cos(2*t)
    -2*Math.cos(3*t)-Math.cos(4*t))*.16,
    0
  );
}

function setTargets(mode){
  for(let i=0;i<COUNT;i++){
    let p;

    if(mode==="portal"){
      const a=Math.random()*Math.PI*2;
      const r=1.65+(Math.random()-.5)*.22;
      p=new THREE.Vector3(
        Math.cos(a)*r,
        Math.sin(a)*r,
        (Math.random()-.5)*.45
      );
    }
    else if(mode==="lightning"){
      const t=Math.random();
      p=new THREE.Vector3(
        (Math.random()-.5)*2.5,
        (t-.5)*4,
        (Math.random()-.5)*1.3
      );
    }
    else if(mode==="orb"){
      p=randomSphere(1.05);
    }
    else if(mode==="heart"){
      const t=Math.random()*Math.PI*2;
      p=heartPoint(t);
      p.multiplyScalar(.8+Math.random()*.2);
      p.z+=(Math.random()-.5)*.8;
    }
    else if(mode==="fist"){
      p=randomSphere(.45);
    }
    else{
      p=randomSphere(2.1);
    }

    targets[i*3]=p.x;
    targets[i*3+1]=p.y;
    targets[i*3+2]=p.z;
  }

  particles.material.color.setHex(colors[mode]);
  flash.style.opacity=".16";
  setTimeout(()=>flash.style.opacity="0",100);
}

function updateLightning(){
  const arr=lightning.geometry.attributes.position.array;
  let x=0,y=-2,z=0;
  for(let i=0;i<20;i++){
    arr[i*3]=x;
    arr[i*3+1]=y+i*.2;
    arr[i*3+2]=z;
    x+=(Math.random()-.5)*.7;
    z+=(Math.random()-.5)*.4;
  }
  lightning.geometry.attributes.position.needsUpdate=true;
  lightning.geometry.computeBoundingSphere();
}

function animate(){
  requestAnimationFrame(animate);
  frame++;

  const pos=geometry.attributes.position.array;
  const speed=currentMode==="fist"?.12:.065;

  for(let i=0;i<COUNT;i++){
    const j=i*3;
    pos[j]+=(targets[j]-pos[j])*speed;
    pos[j+1]+=(targets[j+1]-pos[j+1])*speed;
    pos[j+2]+=(targets[j+2]-pos[j+2])*speed;

    if(currentMode==="universe"){
      pos[j+1]+=Math.sin(frame*.01+i)*.0008;
    }
  }

  geometry.attributes.position.needsUpdate=true;

  particles.rotation.y+=.0025;
  particles.rotation.x+=.0008;

  ring.visible=currentMode==="portal";
  ring2.visible=currentMode==="portal";
  ring.rotation.z+=.012;
  ring2.rotation.z-=.009;
  ring.scale.setScalar(1+Math.sin(frame*.05)*.06);

  orbMesh.visible=currentMode==="orb";
  orbMesh.rotation.x+=.008;
  orbMesh.rotation.y+=.012;
  orbMesh.scale.setScalar(1+Math.sin(frame*.06)*.08);

  lightning.visible=currentMode==="lightning";
  if(frame%3===0)updateLightning();

  renderer.render(scene,camera);
}

function fingerExtended(lm,tip,pip){
  return lm[tip].y<lm[pip].y;
}

function thumbExtended(lm){
  const wrist=lm[0];
  const tip=lm[4];
  const joint=lm[3];
  const d1=Math.hypot(tip.x-wrist.x,tip.y-wrist.y);
  const d2=Math.hypot(joint.x-wrist.x,joint.y-wrist.y);
  return d1>d2*1.12;
}

function classifyHand(lm){
  const thumb=thumbExtended(lm);
  const index=fingerExtended(lm,8,6);
  const middle=fingerExtended(lm,12,10);
  const ringFinger=fingerExtended(lm,16,14);
  const pinky=fingerExtended(lm,20,18);

  // jempol ke atas
  if(thumb&&!index&&!middle&&!ringFinger&&!pinky
    &&lm[4].y<lm[3].y){
    return "orb";
  }

  // shaka: jempol dan kelingking
  if(thumb&&!index&&!middle&&!ringFinger&&pinky){
    return "portal";
  }

  // rock: telunjuk dan kelingking
  if(!thumb&&index&&!middle&&!ringFinger&&pinky){
    return "lightning";
  }

  // peace
  if(!thumb&&index&&middle&&!ringFinger&&!pinky){
    return "heart";
  }

  // kepalan tangan
  if(!index&&!middle&&!ringFinger&&!pinky&&!thumb){
    return "fist";
  }

  return "universe";
}

const labels={
 universe:"✦ UNIVERSE MODE",
 portal:"🌀 PORTAL DIMENSI AKTIF",
 lightning:"⚡ LIGHTNING POWER",
 orb:"🔥 ENERGY ORB",
 heart:"💜 HEART PARTICLES",
 fist:"✊ PARTICLES COLLAPSE"
};

function updateGesture(mode){
  if(mode===lastCandidate){
    stableCount++;
  }else{
    lastCandidate=mode;
    stableCount=0;
  }

  if(stableCount>7&&mode!==currentMode
    &&Date.now()-lastChange>650){
    currentMode=mode;
    targetMode=mode;
    setTargets(mode);
    gestureEl.textContent=labels[mode];
    lastChange=Date.now();
  }
}

async function startCamera(){
  const btn=document.getElementById("start");
  try{
    if(!window.isSecureContext){
      throw new Error("Gunakan HTTPS untuk membuka kamera.");
    }

    btn.disabled=true;
    statusEl.textContent="MEMINTA IZIN KAMERA...";

    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:"user",
        width:{ideal:640},
        height:{ideal:480},
        frameRate:{ideal:30,max:30}
      }
    });

    video.srcObject=stream;
    preview.srcObject=stream;
    await video.play();
    await preview.play();

    statusEl.textContent="MEMUAT AI HAND TRACKING...";

    const vision=await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );

    try{
      handLandmarker=await HandLandmarker.createFromOptions(
        vision,{
          baseOptions:{
            modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
            delegate:"GPU"
          },
          runningMode:"VIDEO",
          numHands:1
        }
      );
    }catch(gpuError){
      handLandmarker=await HandLandmarker.createFromOptions(
        vision,{
          baseOptions:{
            modelAssetPath:
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
            delegate:"CPU"
          },
          runningMode:"VIDEO",
          numHands:1
        }
      );
    }

    running=true;
    statusEl.textContent="KAMERA AKTIF • TUNJUKKAN GESTUR";
    btn.textContent="KAMERA AKTIF";
    btn.disabled=false;
    detectLoop();

  }catch(err){
    console.error(err);
    statusEl.textContent="GAGAL: "+err.message;
    btn.disabled=false;
    btn.textContent="COBA LAGI";
    if(stream){
      stream.getTracks().forEach(t=>t.stop());
      stream=null;
    }
  }
}

function detectLoop(){
  if(!running)return;

  if(video.readyState>=2&&video.currentTime!==lastVideoTime){
    lastVideoTime=video.currentTime;

    const result=handLandmarker.detectForVideo(
      video,performance.now()
    );

    if(result.landmarks&&result.landmarks.length){
      const lm=result.landmarks[0];
      const mode=classifyHand(lm);
      updateGesture(mode);

      cursor.visible=true;
      cursor.position.set(
        (0.5-lm[9].x)*5,
        (0.5-lm[9].y)*4,
        0
      );
    }else{
      cursor.visible=false;
      lastCandidate="";
      stableCount=0;
    }
  }

  requestAnimationFrame(detectLoop);
}

document.getElementById("start").addEventListener(
  "click",startCamera
);

window.addEventListener("resize",()=>{
  if(!renderer)return;
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

initThree();
</script>
</body>
</html>
