
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Senko Universe V4</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  background:#03030b;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
  height:100dvh;
}

#scene{position:fixed;inset:0}
canvas{display:block}

header{
  position:absolute;
  top:18px;
  width:100%;
  text-align:center;
  z-index:3;
  pointer-events:none;
}

h1{
  font-size:18px;
  letter-spacing:5px;
  color:#e5d5ff;
  text-shadow:0 0 18px #a34dff;
}

header p{
  font-size:9px;
  letter-spacing:3px;
  margin-top:7px;
  color:#82749f;
}

#cameraBox{
  position:absolute;
  top:15px;
  right:12px;
  width:85px;
  height:110px;
  overflow:hidden;
  border:1px solid #9250dc;
  border-radius:13px;
  background:#111;
  z-index:5;
  box-shadow:0 0 15px #843aff44;
}

#camera{
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
}

#camLabel{
  position:absolute;
  bottom:0;
  width:100%;
  text-align:center;
  padding:5px;
  font-size:8px;
  background:#080613cc;
  color:#d9c2ff;
}

#info{
  position:absolute;
  bottom:22px;
  left:50%;
  transform:translateX(-50%);
  width:max-content;
  max-width:90%;
  padding:12px 22px;
  border:1px solid #653a99;
  background:#0b0719dd;
  border-radius:30px;
  text-align:center;
  box-shadow:0 0 20px #8c3cff33;
  z-index:5;
}

#status{
  font-size:11px;
  color:#d9baff;
}

#start{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  z-index:8;
  border:1px solid #bd91ff;
  border-radius:30px;
  padding:16px 27px;
  color:white;
  background:linear-gradient(120deg,#6024ad,#a34bff);
  font-weight:bold;
  letter-spacing:1px;
  box-shadow:0 0 30px #9b48ff77;
}

#start:disabled{opacity:.6}

@media(max-height:600px){
  header{top:7px}
  #cameraBox{width:65px;height:80px}
  #info{bottom:8px}
}
</style>
</head>

<body>

<div id="scene"></div>

<header>
  <h1>SENKO UNIVERSE</h1>
  <p>INTERACTIVE COSMIC WORLD</p>
</header>

<div id="cameraBox">
  <video id="camera" autoplay playsinline muted></video>
  <div id="camLabel">CAMERA OFF</div>
</div>

<button id="start">✦ ACTIVATE UNIVERSE</button>

<div id="info">
  <div id="status">✦ UNIVERSE STANDBY</div>
</div>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">

import * as THREE from "three";

const $=id=>document.getElementById(id);

const video=$("camera");
const status=$("status");
const start=$("start");

let tracking=false;
let landmarker=null;
let stream=null;

let handX=0;
let handY=0;
let targetX=0;
let targetY=0;

let lastSeen=0;
let lastVideoTime=-1;
let lastDetection=0;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x03030b);

const camera=new THREE.PerspectiveCamera(
  55,
  innerWidth/innerHeight,
  .1,
  100
);

camera.position.z=12;

const renderer=new THREE.WebGLRenderer({
  antialias:false,
  powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,.85));

$("scene").appendChild(renderer.domElement);

// =================================
// LIGHTING
// =================================

scene.add(new THREE.AmbientLight(0xffffff,.8));

const light=new THREE.PointLight(0x9c58ff,35,30);
light.position.set(2,4,8);
scene.add(light);

const blueLight=new THREE.PointLight(0x277bff,25,25);
blueLight.position.set(-5,-3,5);
scene.add(blueLight);

// =================================
// UNIVERSE GROUP
// =================================

const universe=new THREE.Group();
scene.add(universe);

// =================================
// PLANET MATERIALS
// =================================

function planet(radius,color,roughness=.8){

  const mesh=new THREE.Mesh(
    new THREE.SphereGeometry(radius,20,16),
    new THREE.MeshStandardMaterial({
      color,
      roughness,
      metalness:.15
    })
  );

  return mesh;
}

// CENTRAL PLANET

const central=planet(.9,0x5732b9);
universe.add(central);

// Central glow

const glow=new THREE.Mesh(
  new THREE.SphereGeometry(1.02,16,12),
  new THREE.MeshBasicMaterial({
    color:0x9b43ff,
    wireframe:true,
    transparent:true,
    opacity:.12
  })
);

universe.add(glow);

// =================================
// RING PLANET
// =================================

const saturnGroup=new THREE.Group();

const saturn=planet(.48,0xe2a65f);
saturn.position.set(2.0,.5,0);

saturnGroup.add(saturn);

const ring=new THREE.Mesh(
  new THREE.TorusGeometry(.78,.09,6,48),
  new THREE.MeshStandardMaterial({
    color:0xcba3ff,
    metalness:.6,
    roughness:.4
  })
);

ring.rotation.x=1.1;
saturn.add(ring);

universe.add(saturnGroup);

// =================================
// BLUE PLANET
// =================================

const blue=planet(.34,0x188bff);
blue.position.set(-2,-1,0);
universe.add(blue);

// =================================
// PINK PLANET
// =================================

const pink=planet(.25,0xff398c);
pink.position.set(-1.7,1.6,1);
universe.add(pink);

// =================================
// GREEN PLANET
// =================================

const green=planet(.22,0x37d9a0);
green.position.set(1.4,-1.7,0);
universe.add(green);

// =================================
// SMALL MOONS
// =================================

const moons=[];

for(let i=0;i<5;i++){

  const moon=planet(
    .09+Math.random()*.07,
    [0xffffff,0x8bcaff,0xffb9e8][i%3]
  );

  universe.add(moon);
  moons.push(moon);
}

// =================================
// ORBIT LINES
// =================================

function orbit(radius,color){

  const points=[];

  for(let i=0;i<=100;i++){

    const a=i/100*Math.PI*2;

    points.push(
      new THREE.Vector3(
        Math.cos(a)*radius,
        Math.sin(a)*radius*.65,
        0
      )
    );
  }

  const geo=new THREE.BufferGeometry().setFromPoints(points);

  const line=new THREE.LineLoop(
    geo,
    new THREE.LineBasicMaterial({
      color,
      transparent:true,
      opacity:.35
    })
  );

  universe.add(line);
  return line;
}

const orbit1=orbit(2.2,0x8d55ff);
const orbit2=orbit(2.8,0x297dff);
const orbit3=orbit(3.1,0xb54cff);

orbit1.rotation.x=.5;
orbit2.rotation.y=.7;
orbit3.rotation.x=1.1;

// =================================
// BACKGROUND STARS
// =================================

const STAR_COUNT=650;
const starPositions=new Float32Array(STAR_COUNT*3);

for(let i=0;i<STAR_COUNT;i++){

  starPositions[i*3]=(Math.random()-.5)*35;
  starPositions[i*3+1]=(Math.random()-.5)*25;
  starPositions[i*3+2]=-5-Math.random()*15;
}

const starGeometry=new THREE.BufferGeometry();

starGeometry.setAttribute(
  "position",
  new THREE.BufferAttribute(starPositions,3)
);

const starMaterial=new THREE.PointsMaterial({
  color:0x9b7aff,
  size:.045,
  transparent:true,
  opacity:.8
});

const stars=new THREE.Points(starGeometry,starMaterial);
scene.add(stars);

// =================================
// COSMIC PARTICLES
// =================================

const PARTICLE_COUNT=350;
const particlePositions=new Float32Array(PARTICLE_COUNT*3);

for(let i=0;i<PARTICLE_COUNT;i++){

  const angle=Math.random()*Math.PI*2;
  const radius=2+Math.random()*3;

  particlePositions[i*3]=Math.cos(angle)*radius;
  particlePositions[i*3+1]=Math.sin(angle)*radius;
  particlePositions[i*3+2]=(Math.random()-.5)*2;
}

const particleGeometry=new THREE.BufferGeometry();

particleGeometry.setAttribute(
  "position",
  new THREE.BufferAttribute(particlePositions,3)
);

const particleMaterial=new THREE.PointsMaterial({
  color:0x9d6aff,
  size:.035,
  transparent:true,
  opacity:.7,
  blending:THREE.AdditiveBlending
});

const particles=new THREE.Points(
  particleGeometry,
  particleMaterial
);

universe.add(particles);

// =================================
// HAND TRACKING
// =================================

async function startTracking(){

  start.disabled=true;
  start.textContent="MEMUAT KAMERA...";

  try{

    if(!navigator.mediaDevices?.getUserMedia){
      throw new Error("Gunakan HTTPS untuk membuka kamera");
    }

    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:"user",
        width:{ideal:320},
        height:{ideal:240},
        frameRate:{ideal:20,max:20}
      }
    });

    video.srcObject=stream;
    await video.play();

    const vision=await import(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14"
    );

    const fileset=await vision.FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );

    const options={
      baseOptions:{
        modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate:"CPU"
      },
      runningMode:"VIDEO",
      numHands:1,
      minHandDetectionConfidence:.55,
      minHandPresenceConfidence:.55,
      minTrackingConfidence:.55
    };

    landmarker=await vision.HandLandmarker.createFromOptions(
      fileset,
      options
    );

    tracking=true;

    $("camLabel").textContent="CAMERA ACTIVE";
    status.textContent="✦ TUNJUKKAN TANGANMU";

    start.style.display="none";

    requestAnimationFrame(trackHands);

  }catch(error){

    console.error(error);

    status.textContent="KAMERA GAGAL: "+error.message;

    start.disabled=false;
    start.textContent="COBA LAGI";

    if(stream){
      stream.getTracks().forEach(t=>t.stop());
      stream=null;
    }
  }
}

// =================================
// STABLE HAND POSITION
// =================================

function clamp(value,min,max){
  return Math.max(min,Math.min(max,value));
}

function trackHands(now){

  if(!tracking)return;

  requestAnimationFrame(trackHands);

  // maksimal 15-20 kali deteksi per detik

  if(now-lastDetection<65)return;

  if(video.readyState<2)return;

  if(video.currentTime===lastVideoTime)return;

  lastDetection=now;
  lastVideoTime=video.currentTime;

  try{

    const result=landmarker.detectForVideo(video,now);

    if(result.landmarks?.length){

      const lm=result.landmarks[0];

      // titik tengah telapak, bukan pergelangan saja

      const palmX=(
        lm[0].x+
        lm[5].x+
        lm[9].x+
        lm[13].x+
        lm[17].x
      )/5;

      const palmY=(
        lm[0].y+
        lm[5].y+
        lm[9].y+
        lm[13].y+
        lm[17].y
      )/5;

      // Batasi pergerakan agar seluruh planet tetap terlihat

      const aspect=innerWidth/innerHeight;
      const viewHeight=2*Math.tan(THREE.MathUtils.degToRad(55/2))*12;
      const viewWidth=viewHeight*aspect;

      const safeX=Math.max(.3,viewWidth/2-3.4);
      const safeY=Math.max(.3,viewHeight/2-3.4);

      const rawX=(.5-palmX)*viewWidth*1.25;
      const rawY=(.5-palmY)*viewHeight*1.25;

      targetX=clamp(rawX,-safeX,safeX);
      targetY=clamp(rawY,-safeY,safeY);

      lastSeen=now;

      status.textContent="✦ HAND TRACKING ACTIVE";

    }else{

      status.textContent="✦ MENUNGGU TANGAN...";
    }

  }catch(error){
    console.warn(error);
  }
}

// =================================
// ANIMATION
// =================================

const clock=new THREE.Clock();

function animate(){

  requestAnimationFrame(animate);

  const dt=Math.min(clock.getDelta(),.04);
  const time=clock.elapsedTime;

  // Tracking smoothing

  const seen=performance.now()-lastSeen;

  if(seen>1200){

    // Jika tangan hilang, kembali perlahan ke tengah

    targetX*=.985;
    targetY*=.985;
  }

  const smooth=1-Math.pow(.001,dt);

  handX+=(targetX-handX)*smooth;
  handY+=(targetY-handY)*smooth;

  // Posisi universe dibatasi

  universe.position.x=clamp(handX,-4,4);
  universe.position.y=clamp(handY,-4,4);

  // Rotasi lembut, bukan mengikuti sudut tangan

  central.rotation.y+=dt*.15;
  central.rotation.x=Math.sin(time*.3)*.08;

  glow.rotation.y-=dt*.12;
  glow.rotation.x+=dt*.1;

  saturnGroup.rotation.y+=dt*.35;
  saturn.rotation.y+=dt*.3;

  blue.rotation.y+=dt*.45;
  pink.rotation.y+=dt*.5;
  green.rotation.y+=dt*.4;

  // Planet kecil mengorbit

  moons.forEach((moon,i)=>{

    const angle=time*(.35+i*.08)+i*1.25;
    const radius=1.2+i*.36;

    moon.position.x=Math.cos(angle)*radius;
    moon.position.y=Math.sin(angle)*radius*.7;
    moon.position.z=Math.sin(angle*1.3)*.7;
  });

  // Efek kosmik

  stars.rotation.y+=dt*.008;
  particles.rotation.y+=dt*.035;
  particles.rotation.x=Math.sin(time*.2)*.08;

  renderer.render(scene,camera);
}

// =================================
// START
// =================================

$("start").addEventListener("click",startTracking);

animate();

// =================================
// RESPONSIVE
// =================================

window.addEventListener("resize",()=>{

  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();

  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,.85));

});

// =================================
// CLEANUP
// =================================

window.addEventListener("pagehide",()=>{

  tracking=false;

  if(stream){
    stream.getTracks().forEach(t=>t.stop());
  }

  if(landmarker){
    landmarker.close();
  }

});

</script>
</body>
</html>
