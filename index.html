
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#100c20">
<title>Yuna Virtual Pet</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
 background:#100c20;
 color:white;
 font-family:Arial,sans-serif;
 min-height:100vh;
 overflow-x:hidden;
 background-image:
 radial-gradient(ellipse at 50% 30%,#49266d 0%,transparent 55%),
 linear-gradient(160deg,#100c20,#17132d);
}

header{
 padding:20px;
 display:flex;
 justify-content:space-between;
 align-items:center;
 border-bottom:1px solid #ffffff18;
}

.logo{
 color:#e5a8ff;
 font-weight:bold;
 letter-spacing:3px;
 font-size:18px;
}

.online{
 color:#8effc5;
 font-size:11px;
}

main{
 max-width:480px;
 margin:auto;
 padding:16px;
}

.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:9px;
 margin:10px 0 18px;
}

.stat{
 background:#ffffff0c;
 border:1px solid #ffffff16;
 border-radius:12px;
 padding:12px 7px;
 text-align:center;
}

.stat small{
 color:#c3a9d8;
 font-size:10px;
}

.stat strong{
 display:block;
 margin-top:7px;
 color:#f0c8ff;
 font-size:15px;
}

.scene{
 height:390px;
 border-radius:22px;
 border:1px solid #b46bff40;
 position:relative;
 overflow:hidden;
 display:flex;
 justify-content:center;
 align-items:center;
 background:
 radial-gradient(ellipse at 50% 65%,#9e51cc35,transparent 48%),
 linear-gradient(180deg,#19132e,#24153b 70%,#100e23);
 box-shadow:0 0 30px #9b47c733;
}

.scene:before{
 content:"";
 position:absolute;
 width:270px;
 height:270px;
 border:1px solid #d5a1ff25;
 border-radius:50%;
 box-shadow:0 0 40px #bd74ff22;
}

.scene:after{
 content:"";
 position:absolute;
 bottom:36px;
 width:190px;
 height:24px;
 border-radius:50%;
 background:#b36cff35;
 filter:blur(12px);
}

.stars{
 position:absolute;
 inset:0;
 background-image:
 radial-gradient(#fff 1px,transparent 1px),
 radial-gradient(#d9aaff 1px,transparent 1px);
 background-size:57px 61px,83px 93px;
 background-position:0 0,30px 20px;
 opacity:.4;
}

.character{
 position:relative;
 z-index:2;
 width:190px;
 height:315px;
 animation:float 3s ease-in-out infinite;
 transform-origin:center bottom;
}

@keyframes float{
 0%,100%{transform:translateY(0)}
 50%{transform:translateY(-9px)}
}

.hair-back{
 position:absolute;
 top:17px;
 left:23px;
 width:145px;
 height:170px;
 border-radius:48% 48% 35% 35%;
 background:linear-gradient(120deg,#21132f,#63328a,#21132f);
}

.hair-back:before,.hair-back:after{
 content:"";
 position:absolute;
 top:80px;
 width:37px;
 height:115px;
 background:linear-gradient(90deg,#291537,#7944a5);
 border-radius:20px 20px 50% 50%;
}

.hair-back:before{left:-5px;transform:rotate(8deg)}
.hair-back:after{right:-5px;transform:rotate(-8deg)}

.body{
 position:absolute;
 top:173px;
 left:45px;
 width:100px;
 height:140px;
 background:linear-gradient(120deg,#f5eaff,#c6a3e9 60%,#77509e);
 border-radius:32px 32px 15px 15px;
 border:2px solid #e9d2ff;
}

.body:before{
 content:"";
 position:absolute;
 top:-12px;
 left:32px;
 width:35px;
 height:25px;
 background:#f5c9b9;
 border-radius:10px;
}

.collar{
 position:absolute;
 top:0;
 left:30px;
 width:40px;
 height:28px;
 background:#a65ad6;
 clip-path:polygon(0 0,100% 0,50% 100%);
}

.arm{
 position:absolute;
 top:187px;
 width:28px;
 height:94px;
 background:#e6c8fa;
 border-radius:20px;
}

.arm.left{left:29px;transform:rotate(12deg)}
.arm.right{right:29px;transform:rotate(-12deg)}

.hand{
 position:absolute;
 bottom:0;
 left:3px;
 width:24px;
 height:27px;
 background:#f5cbbd;
 border-radius:50%;
}

.legs{
 position:absolute;
 top:285px;
 left:56px;
 width:80px;
 display:flex;
 justify-content:space-between;
}

.leg{
 width:28px;
 height:27px;
 background:#eacbfa;
 border-radius:5px 5px 12px 12px;
}

.head{
 position:absolute;
 top:40px;
 left:36px;
 width:118px;
 height:133px;
 background:linear-gradient(135deg,#ffe1d7,#f3bfc0);
 border-radius:47% 47% 45% 45%;
 z-index:3;
}

.fringe{
 position:absolute;
 top:24px;
 left:29px;
 width:132px;
 height:77px;
 background:linear-gradient(120deg,#25142f,#57306f,#27152f);
 border-radius:65% 65% 25% 25%;
 z-index:4;
 clip-path:polygon(0 0,100% 0,100% 75%,85% 60%,72% 100%,60% 66%,46% 100%,34% 64%,17% 100%,10% 64%,0 80%);
}

.bangs{
 position:absolute;
 top:70px;
 left:32px;
 width:32px;
 height:75px;
 background:#412452;
 border-radius:10px 10px 70% 70%;
 transform:rotate(9deg);
 z-index:5;
}

.eye{
 position:absolute;
 top:91px;
 width:15px;
 height:22px;
 border-radius:50%;
 background:#512a75;
 z-index:6;
}

.eye:after{
 content:"";
 position:absolute;
 top:3px;
 left:3px;
 width:5px;
 height:8px;
 border-radius:50%;
 background:white;
}

.eye.left{left:60px}
.eye.right{right:60px}

.blush{
 position:absolute;
 top:119px;
 width:19px;
 height:8px;
 border-radius:50%;
 background:#ef879e77;
 z-index:6;
}

.blush.left{left:44px}
.blush.right{right:44px}

.mouth{
 position:absolute;
 top:128px;
 left:89px;
 width:14px;
 height:7px;
 border-bottom:2px solid #a34f73;
 border-radius:50%;
 z-index:6;
}

.hairclip{
 position:absolute;
 top:57px;
 right:31px;
 z-index:7;
 color:#f5b8ff;
 font-size:22px;
}

.character.happy .mouth{
 width:19px;
 height:12px;
 border:2px solid #a34f73;
 border-top:0;
}

.character.sad .mouth{
 top:137px;
 border-bottom:0;
 border-top:2px solid #a34f73;
}

.character.surprised .mouth{
 width:11px;
 height:14px;
 border:2px solid #a34f73;
 border-radius:50%;
}

.character.blink .eye{
 height:3px;
 top:101px;
 border-radius:50%;
}

.character.sleep .eye{
 height:3px;
 top:101px;
 border-radius:50%;
}

.name{
 position:absolute;
 bottom:12px;
 z-index:5;
 color:#e7c0ff;
 font-size:12px;
 letter-spacing:3px;
}

.dialog{
 text-align:center;
 padding:16px 10px;
 color:#efd7ff;
 font-size:14px;
 line-height:1.6;
 min-height:65px;
}

.panel{
 background:#ffffff0b;
 border:1px solid #ffffff19;
 border-radius:15px;
 padding:14px;
 margin-bottom:13px;
}

.title{
 color:#dba9ff;
 font-size:11px;
 letter-spacing:2px;
 margin-bottom:12px;
}

.actions{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:8px;
}

.action{
 padding:13px 3px;
 border:1px solid #a66bce35;
 border-radius:12px;
 color:white;
 background:#49276555;
 font-size:11px;
}

.action span{
 display:block;
 font-size:23px;
 margin-bottom:7px;
}

.action:active{background:#8446a9}

.chat{
 height:145px;
 overflow-y:auto;
 display:flex;
 flex-direction:column;
 gap:9px;
}

.msg{
 max-width:90%;
 padding:10px;
 border-radius:10px;
 font-size:12px;
 line-height:1.5;
 overflow-wrap:anywhere;
}

.bot{background:#492c63;align-self:flex-start}
.user{background:#69439a;align-self:flex-end}

.controls{
 display:flex;
 gap:7px;
 margin-top:10px;
}

input{
 flex:1;
 min-width:0;
 padding:12px;
 border-radius:9px;
 border:1px solid #a66bce55;
 background:#171126;
 color:white;
 outline:none;
}

button{
 cursor:pointer;
}

.send{
 background:#9c59ce;
 color:white;
 border:0;
 border-radius:9px;
 padding:10px 15px;
}

.voice{
 width:100%;
 background:linear-gradient(90deg,#7541ad,#bd68d7);
 color:white;
 border:0;
 border-radius:10px;
 padding:14px;
 margin-top:10px;
 font-weight:bold;
}

footer{
 text-align:center;
 color:#9079a5;
 font-size:10px;
 padding:15px;
}
</style>
</head>

<body>

<header>
 <div class="logo">✦ YUNA PET</div>
 <div class="online">● ONLINE</div>
</header>

<main>

 <section class="stats">
  <div class="stat">
   <small>❤️ KEDekatan</small>
   <strong id="love">10</strong>
  </div>
  <div class="stat">
   <small>⚡ ENERGI</small>
   <strong id="energy">100</strong>
  </div>
  <div class="stat">
   <small>⭐ LEVEL</small>
   <strong id="level">1</strong>
  </div>
 </section>

 <section class="scene">
  <div class="stars"></div>

  <div class="character" id="character">
   <div class="hair-back"></div>
   <div class="body"><div class="collar"></div></div>
   <div class="arm left"><div class="hand"></div></div>
   <div class="arm right"><div class="hand"></div></div>
   <div class="legs">
    <div class="leg"></div>
    <div class="leg"></div>
   </div>
   <div class="head"></div>
   <div class="fringe"></div>
   <div class="bangs"></div>
   <div class="eye left"></div>
   <div class="eye right"></div>
   <div class="blush left"></div>
   <div class="blush right"></div>
   <div class="mouth"></div>
   <div class="hairclip">✦</div>
  </div>

  <div class="name">Y U N A</div>
 </section>

 <div class="dialog" id="dialog">
  Halo kaka! Aku Yuna. Senang akhirnya bisa bertemu denganmu 💜
 </div>

 <section class="panel">
  <div class="title">INTERACTION SYSTEM</div>
  <div class="actions">
   <button class="action" onclick="interact('hi')">
    <span>👋</span>SAPA
   </button>
   <button class="action" onclick="interact('love')">
    <span>💗</span>PUJI
   </button>
   <button class="action" onclick="interact('play')">
    <span>🎮</span>MAIN
   </button>
   <button class="action" onclick="interact('gift')">
    <span>🎁</span>HADIAH
   </button>
  </div>
 </section>

 <section class="panel">
  <div class="title">YUNA CHAT ROOM</div>

  <div class="chat" id="chat">
   <div class="msg bot">
    Yuna: Kaka mau ngobrol apa hari ini? ✨
   </div>
  </div>

  <div class="controls">
   <input id="input" placeholder="Ngobrol dengan Yuna...">
   <button class="send" onclick="send()">➤</button>
  </div>

  <button class="voice" onclick="toggleVoice()" id="voice">
   🎙️ AKTIFKAN SUARA
  </button>
 </section>

 <footer>YUNA VIRTUAL PET • VERSION 1.0</footer>

</main>

<script>
const $=id=>document.getElementById(id);

let love=Number(localStorage.getItem("yunaLove"))||10;
let energy=Number(localStorage.getItem("yunaEnergy"))||100;
let level=Number(localStorage.getItem("yunaLevel"))||1;

let listening=false;
let recognition=null;

function save(){
 localStorage.setItem("yunaLove",love);
 localStorage.setItem("yunaEnergy",energy);
 localStorage.setItem("yunaLevel",level);
}

function update(){
 $("love").textContent=love;
 $("energy").textContent=energy;
 $("level").textContent=level;
}

function mood(type){
 const c=$("character");
 c.className="character "+type;
}

function say(text,type="happy"){
 $("dialog").textContent=text;
 mood(type);
}

function speak(text){
 if(!("speechSynthesis" in window))return;

 speechSynthesis.cancel();

 const u=new SpeechSynthesisUtterance(text);
 u.lang="id-ID";
 u.rate=0.95;
 u.pitch=1.3;

 const voices=speechSynthesis.getVoices();
 const female=voices.find(v=>
  /female|woman|perempuan/i.test(v.name)
 );

 if(female)u.voice=female;

 speechSynthesis.speak(u);
}

function response(text,type="happy"){
 say(text,type);
 speak(text);
}

function increaseLove(amount){
 love=Math.min(100,love+amount);
 if(love>=100){
  love=100;
 }
 level=Math.floor(love/20)+1;
 save();
 update();
}

function interact(action){

 if(action==="hi"){
  increaseLove(2);
  energy=Math.max(0,energy-1);
  response("Halooo kaka! Hari ini mau ngapain bareng aku? 💜");
 }

 else if(action==="love"){
  increaseLove(5);
  response("Ehehe... kaka bisa aja. Aku jadi malu nih! 💗","happy");
 }

 else if(action==="play"){
  if(energy<10){
   response("Aku lagi capek, kaka. Istirahat sebentar yuk.","sad");
   return;
  }

  energy=Math.max(0,energy-10);
  increaseLove(4);
  response("YEAY! Seru banget main bareng kaka! 🎮");
 }

 else if(action==="gift"){
  increaseLove(8);
  response("Waaah! Hadiah buat aku?! Makasih banyak kaka! 🎁");
 }

 save();
 update();
}

function addMessage(text,type){
 const d=document.createElement("div");
 d.className="msg "+type;
 d.textContent=text;
 $("chat").appendChild(d);
 $("chat").scrollTop=$("chat").scrollHeight;
}

function chatResponse(text){
 const t=text.toLowerCase();

 if(t.includes("halo")||t.includes("hai")){
  return ["Halooo kaka! 💜","Haiii! Aku di sini!","Kaka manggil aku? Hehe."];
 }

 if(t.includes("nama")){
  return ["Namaku Yuna! Virtual pet kesayangan kaka ✨"];
 }

 if(t.includes("apa kabar")||t.includes("gimana")){
  return ["Aku baik! Apalagi kalau bisa ngobrol sama kaka.","Energi aku masih bagus!"];
 }

 if(t.includes("sayang")||t.includes("suka")){
  return ["Kaka orang yang baik! Aku senang jadi teman virtual kaka 💜"];
 }

 if(t.includes("sedih")||t.includes("capek")){
  return ["Istirahat sebentar ya kaka. Jangan terlalu memaksakan diri.","Aku siap menemani kaka ngobrol. Semoga harinya membaik."];
 }

 if(t.includes("makan")){
  return ["Jangan lupa makan ya kaka! 🍰","Kalau aku bisa makan, mungkin aku pilih kue stroberi!"];
 }

 if(t.includes("tidur")){
  return ["Selamat istirahat kaka! Semoga tidurmu nyenyak 🌙"];
 }

 if(t.includes("terima kasih")){
  return ["Sama-sama kaka! 💗","Hehe, dengan senang hati!"];
 }

 if(t.includes("lucu")){
  increaseLove(2);
  return ["Aku lucu?! Ehehe, makasih kaka!"];
 }

 if(t.includes("level")){
  return ["Level aku sekarang "+level+"! Kedekatan kita "+love+" poin."];
 }

 if(t.includes("energi")){
  return ["Energi aku sekarang "+energy+" persen."];
 }

 if(t.includes("siapa")){
  return ["Aku Yuna, teman virtual yang tinggal di HP kaka!"];
 }

 if(t.includes("main")){
  interact("play");
  return null;
 }

 if(t.includes("puji")){
  interact("love");
  return null;
 }

 if(t.includes("jam")){
  return ["Sekarang pukul "+new Date().toLocaleTimeString("id-ID")];
 }

 if(t.includes("tanggal")){
  return ["Hari ini "+new Date().toLocaleDateString("id-ID")];
 }

 return [
  "Ceritain lagi dong kaka, aku mau dengar! 💜",
  "Hmm, menarik! Bisa jelaskan lebih banyak?",
  "Hehe, aku masih belajar memahami percakapan kaka.",
  "Aku senang kaka mengajakku ngobrol!"
 ];
}

function send(){
 const input=$("input");
 const text=input.value.trim();
 if(!text)return;

 input.value="";
 addMessage("Kaka: "+text,"user");

 const result=chatResponse(text);

 if(result){
  const answer=result[Math.floor(Math.random()*result.length)];
  setTimeout(()=>{
   addMessage("Yuna: "+answer,"bot");
   response(answer);
  },400);
 }
}

$("input").addEventListener("keydown",e=>{
 if(e.key==="Enter")send();
});

function toggleVoice(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;

 if(!SR){
  response("Browser kaka belum mendukung pengenalan suara. Coba Chrome ya!","sad");
  return;
 }

 if(listening){
  recognition.stop();
  return;
 }

 recognition=new SR();
 recognition.lang="id-ID";
 recognition.continuous=false;
 recognition.interimResults=false;

 recognition.onstart=()=>{
  listening=true;
  $("voice").textContent="🔴 MENDENGARKAN...";
  say("Aku mendengarkan kaka...");
 };

 recognition.onresult=e=>{
  $("input").value=e.results[0][0].transcript;
  send();
 };

 recognition.onerror=()=>{
  say("Ada masalah dengan mikrofon kaka.","sad");
 };

 recognition.onend=()=>{
  listening=false;
  $("voice").textContent="🎙️ AKTIFKAN SUARA";
 };

 try{
  recognition.start();
 }catch(e){}
}

setInterval(()=>{
 if(energy<100){
  energy=Math.min(100,energy+1);
  save();
  update();
 }
},30000);

setInterval(()=>{
 const c=$("character");
 if(!c.classList.contains("happy")&&
    !c.classList.contains("sad")&&
    !c.classList.contains("surprised")){
  c.classList.add("blink");
  setTimeout(()=>c.classList.remove("blink"),250);
 }
},4000);

update();
</script>

</body>
  </html>
