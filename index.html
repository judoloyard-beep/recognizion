
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Face Motion Tracker</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #050711;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}

.app {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  padding: 18px;
  gap: 14px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.logo {
  color: #a855f7;
  font-size: 20px;
  font-weight: bold;
  letter-spacing: 2px;
}

.status {
  color: #00ffae;
  font-size: 11px;
}

.camera {
  flex: 1;
  min-height: 0;
  position: relative;
  overflow: hidden;
  border: 1px solid #7137b8;
  border-radius: 20px;
  background: #101322;
  box-shadow: 0 0 25px #7626b533;
}

video, canvas {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
}

canvas {
  pointer-events: none;
}

.overlay {
  position: absolute;
  inset: 12px;
  border: 1px solid #a855f733;
  border-radius: 12px;
  pointer-events: none;
}

.scan {
  position: absolute;
  height: 2px;
  width: 100%;
  background: linear-gradient(
    90deg, transparent, #a855f7, #00eaff, transparent
  );
  box-shadow: 0 0 15px #a855f7;
  animation: scan 4s linear infinite;
}

@keyframes scan {
  0% { top: 0; }
  100% { top: 100%; }
}

.info {
  background: #101322;
  border: 1px solid #292441;
  border-radius: 16px;
  padding: 15px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
}

.label {
  font-size: 10px;
  color: #9293a9;
  margin-bottom: 5px;
}

.value {
  font-size: 16px;
  color: #c084fc;
  font-weight: bold;
}

.controls {
  display: flex;
  gap: 10px;
}

button {
  flex: 1;
  border: none;
  padding: 15px;
  border-radius: 12px;
  background: #9333ea;
  color: white;
  font-weight: bold;
  font-size: 14px;
}

button.stop {
  background: #28243b;
}

footer {
  text-align: center;
  font-size: 10px;
  color: #696a83;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="logo">NEURAL / VISION</div>
  <div class="status" id="status">● OFFLINE</div>
</header>

<div class="camera">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div class="overlay"></div>
  <div class="scan"></div>
</div>

<div class="info">

  <div>
    <div class="label">FACE STATUS</div>
    <div class="value" id="face">NOT DETECTED</div>
  </div>

  <div>
    <div class="label">MOTION</div>
    <div class="value" id="motion">STANDBY</div>
  </div>

  <div>
    <div class="label">POSITION X</div>
    <div class="value" id="posX">0.00</div>
  </div>

  <div>
    <div class="label">POSITION Y</div>
    <div class="value" id="posY">0.00</div>
  </div>

</div>

<div class="controls">
  <button onclick="startCamera()">START TRACKING</button>
  <button class="stop" onclick="stopCamera()">STOP</button>
</div>

<footer>AI FACE MOTION TRACKING SYSTEM • MEDIAPIPE</footer>

</div>

<script type="module">

import {
  FaceLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const statusText = document.getElementById("status");
const faceText = document.getElementById("face");
const motionText = document.getElementById("motion");
const posX = document.getElementById("posX");
const posY = document.getElementById("posY");

let landmarker;
let stream;
let running = false;
let previousX = null;
let previousY = null;
let smoothX = 0;
let smoothY = 0;
let lastFrame = -1;

async function initializeAI() {

  statusText.textContent = "● LOADING AI";

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  landmarker = await FaceLandmarker.createFromOptions(
    vision,
    {
      baseOptions: {
        modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
        delegate: "GPU"
      },
      runningMode: "VIDEO",
      numFaces: 1,
      minFaceDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5,
      minFacePresenceConfidence: 0.5
    }
  );

}

async function startCamera() {

  try {

    if (!landmarker) await initializeAI();

    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: "user",
        width: { ideal: 640 },
        height: { ideal: 480 }
      },
      audio: false
    });

    video.srcObject = stream;
    await video.play();

    running = true;

    statusText.textContent = "● SYSTEM ACTIVE";

    resizeCanvas();
    requestAnimationFrame(trackFace);

  } catch(error) {

    statusText.textContent = "● CAMERA ERROR";
    console.error(error);
    alert("Kamera gagal dibuka. Pastikan izin kamera aktif dan halaman menggunakan HTTPS.");

  }

}

function resizeCanvas() {
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
}

function trackFace() {

  if (!running) return;

  if (video.readyState >= 2 && video.currentTime !== lastFrame) {

    lastFrame = video.currentTime;

    const result = landmarker.detectForVideo(
      video,
      performance.now()
    );

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (result.faceLandmarks.length > 0) {

      const points = result.faceLandmarks[0];

      let minX = 1, minY = 1;
      let maxX = 0, maxY = 0;

      points.forEach(p => {
        minX = Math.min(minX, p.x);
        minY = Math.min(minY, p.y);
        maxX = Math.max(maxX, p.x);
        maxY = Math.max(maxY, p.y);
      });

      const x = (minX + maxX) / 2;
      const y = (minY + maxY) / 2;

      smoothX += (x - smoothX) * 0.3;
      smoothY += (y - smoothY) * 0.3;

      const boxX = minX * canvas.width;
      const boxY = minY * canvas.height;
      const boxW = (maxX - minX) * canvas.width;
      const boxH = (maxY - minY) * canvas.height;

      // FACE TRACKING BOX

      ctx.strokeStyle = "#c084fc";
      ctx.lineWidth = 3;
      ctx.shadowColor = "#a855f7";
      ctx.shadowBlur = 15;

      ctx.strokeRect(boxX, boxY, boxW, boxH);

      // LANDMARK DOTS

      ctx.fillStyle = "#00eaff";
      ctx.shadowColor = "#00eaff";

      for (let i = 0; i < points.length; i += 5) {

        ctx.beginPath();
        ctx.arc(
          points[i].x * canvas.width,
          points[i].y * canvas.height,
          2,
          0,
          Math.PI * 2
        );
        ctx.fill();

      }

      // CENTER TARGET

      ctx.beginPath();
      ctx.arc(
        smoothX * canvas.width,
        smoothY * canvas.height,
        7,
        0,
        Math.PI * 2
      );

      ctx.fillStyle = "#ffffff";
      ctx.fill();

      ctx.shadowBlur = 0;

      // MOTION ANALYSIS

      let direction = "STABLE";

      if (previousX !== null) {

        const dx = smoothX - previousX;
        const dy = smoothY - previousY;

        if (Math.abs(dx) > 0.004 || Math.abs(dy) > 0.004) {

          if (Math.abs(dx) > Math.abs(dy)) {
            direction = dx > 0 ? "RIGHT" : "LEFT";
          } else {
            direction = dy > 0 ? "DOWN" : "UP";
          }

        }

      }

      previousX = smoothX;
      previousY = smoothY;

      faceText.textContent = "DETECTED";
      motionText.textContent = direction;

      posX.textContent = smoothX.toFixed(3);
      posY.textContent = smoothY.toFixed(3);

    } else {

      faceText.textContent = "NOT DETECTED";
      motionText.textContent = "SEARCHING";
      previousX = null;
      previousY = null;

    }

  }

  requestAnimationFrame(trackFace);

}

function stopCamera() {

  running = false;

  if (stream) {
    stream.getTracks().forEach(track => track.stop());
    stream = null;
  }

  video.srcObject = null;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  statusText.textContent = "● OFFLINE";
  faceText.textContent = "NOT DETECTED";
  motionText.textContent = "STANDBY";

  previousX = null;
  previousY = null;

}

window.startCamera = startCamera;
window.stopCamera = stopCamera;

</script>

</body>
</html>
