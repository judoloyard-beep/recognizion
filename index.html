
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SENKO UNIVERSE V6</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  overflow: hidden;
  background: #02030a;
  color: white;
  font-family: Arial, sans-serif;
}

canvas {
  display: block;
}

#ui {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 5;
}

.header {
  position: absolute;
  top: 18px;
  left: 0;
  width: 100%;
  text-align: center;
}

.header h1 {
  font-size: 21px;
  letter-spacing: 5px;
  color: #b9a4ff;

#status {

  color: white;
  border: 1px solid #b9a4ff;
  border-radius: 12px;
  pointer-events: auto;
  z-index: 10;
}

#cameraBox {
  position: absolute;
  right: 12px;
  bottom: 115px;
  width: 105px;
  height: 80px;
  border: 1px solid #7856c7;
  border-radius: 10px;
  overflow: hidden;
  opacity: .65;

}

#video {

}

  position: absolute;

}

.hidden {
  display: none !important;
}
</style>
</head>

<body>

<div id="ui">
  <div class="header">
    <h1>SENKO UNIVERSE</h1>
    <p>HAND CONTROL SYSTEM V6</p>
  </div>

  <div id="status">SYSTEM READY</div>

  <button id="start">✦ AKTIFKAN KAMERA</button>

  <div id="help">
    ✋ OPEN PALM : EXPLOSION<br>
    ✊ FIST : ATTRACT PARTICLES<br>
    🤏 PINCH : ZOOM<br>
    ✌️ PEACE : CHANGE MODE
  </div>

  <div id="cameraBox">
    <video id="video" autoplay playsinline muted></video>
  </div>

  <div id="controls">
    <button class="active" data-mode="space">SPACE</button>
    <button data-mode="saturn">SATURN</button>
    <button data-mode="love">LOVE</button>
    <button data-mode="heart">HEART</button>
    <button data-mode="solar">SOLAR SYSTEM</button>
    <button id="skeletonBtn" class="active">SKELETON ON</button>
    <button id="holoBtn" class="active">HOLOGRAM ON</button>
  </div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import { FilesetResolver, HandLandmarker } from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const status = document.getElementById("status");
const video = document.getElementById("video");
const startButton = document.getElementById("start");

let handLandmarker = null;
let cameraStream = null;
let cameraRunning = false;
let lastVideoTime = -1;

let currentMode = "space";
let previousGesture = "";
let lastModeChange = 0;
let lastExplosion = 0;

let skeletonEnabled = true;
let hologramEnabled = true;
let handDetected = false;

let handX = 0;
let handY = 0;
let handScale = 1;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x02030a);

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  1000
);
camera.position.set(0, 0, 11);

const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const clock = new THREE.Clock();

scene.add(new THREE.AmbientLight(0xffffff, 1.2));

const mainLight = new THREE.PointLight(0x9c72ff, 4, 30);
mainLight.position.set(0, 3, 7);
scene.add(mainLight);

// ================================
// BACKGROUND STARS
// ================================

const starGeometry = new THREE.BufferGeometry();
const starPositions = [];

for (let i = 0; i < 1500; i++) {
  starPositions.push(
    (Math.random() - 0.5) * 90,
    (Math.random() - 0.5) * 70,
    (Math.random() - 0.5) * 50
  );
}

starGeometry.setAttribute(
  "position",
  new THREE.Float32BufferAttribute(starPositions, 3)
);

const stars = new THREE.Points(
  starGeometry,
  new THREE.PointsMaterial({
    color: 0x9d8aff,
    size: 0.055,
    transparent: true,
    opacity: 0.8
  })
);

scene.add(stars);

// ================================
// PARTICLE UNIVERSE
// ================================

const PARTICLE_COUNT = 1800;

const particleGeometry = new THREE.BufferGeometry();
const particlePositions = new Float32Array(PARTICLE_COUNT * 3);
const particleColors = new Float32Array(PARTICLE_COUNT * 3);

const originalPositions = [];
const velocities = [];

for (let i = 0; i < PARTICLE_COUNT; i++) {
  const x = (Math.random() - 0.5) * 8;
  const y = (Math.random() - 0.5) * 6;
  const z = (Math.random() - 0.5) * 4;

  originalPositions.push(new THREE.Vector3(x, y, z));
  velocities.push(new THREE.Vector3());

  particlePositions[i * 3] = x;
  particlePositions[i * 3 + 1] = y;
  particlePositions[i * 3 + 2] = z;

  particleColors[i * 3] = 0.55 + Math.random() * 0.4;
  particleColors[i * 3 + 1] = 0.3 + Math.random() * 0.5;
  particleColors[i * 3 + 2] = 1;
}

particleGeometry.setAttribute(
  "position",
  new THREE.BufferAttribute(particlePositions, 3)
);

particleGeometry.setAttribute(
  "color",
  new THREE.BufferAttribute(particleColors, 3)
);

const particleMaterial = new THREE.PointsMaterial({
  size: 0.045,
  vertexColors: true,
  transparent: true,
  opacity: 0.95,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});

const particleSystem = new THREE.Points(
  particleGeometry,
  particleMaterial
);

scene.add(particleSystem);

// ================================
// PARTICLE SHAPE FUNCTIONS
// ================================

function getParticleTarget(i, time) {
  const a = i * 2.399;
  const r = Math.sqrt(Math.random());

  if (currentMode === "space") {
    const angle = a + time * 0.12;
    const radius = 1.3 + (i % 100) / 45;

    return new THREE.Vector3(
      Math.cos(angle) * radius,
      Math.sin(angle) * radius,
      Math.sin(a * 0.7) * 1.8
    );
  }

  if (currentMode === "saturn") {
    if (i < PARTICLE_COUNT * 0.45) {
      const u = i / (PARTICLE_COUNT * 0.45);
      const phi = Math.acos(2 * u - 1);
      const theta = a;

      return new THREE.Vector3(
        1.1 * Math.sin(phi) * Math.cos(theta),
        1.1 * Math.cos(phi),
        1.1 * Math.sin(phi) * Math.sin(theta)
      );
    }

    const angle = a + time * 0.25;
    const radius = 1.6 + (i % 100) / 80;

    return new THREE.Vector3(
      Math.cos(angle) * radius,
      Math.sin(angle) * radius * 0.3,
      Math.sin(angle) * 0.4
    );
  }

  if (currentMode === "love") {
    const angle = a;
    const radius = 1.4 + Math.sin(a * 3) * 0.15;

    return new THREE.Vector3(
      Math.cos(angle) * radius,
      Math.sin(angle) * radius,
      Math.sin(angle * 2) * 0.6
    );
  }

  if (currentMode === "heart") {
    const t = a % (Math.PI * 2);

    const x = 0.16 * Math.pow(Math.sin(t), 3) * 10;
    const y = (
      0.13 * Math.cos(t) -
      0.05 * Math.cos(2 * t) -
      0.02 * Math.cos(3 * t) -
      0.01 * Math.cos(4 * t)
    ) * 10;

    return new THREE.Vector3(
      x * 0.55 + (Math.random() - 0.5) * 0.2,
      y * 0.55 + (Math.random() - 0.5) * 0.2,
      (Math.random() - 0.5) * 1.1
    );
  }

  return new THREE.Vector3(
    Math.cos(a) * (1 + r),
    Math.sin(a) * (1 + r),
    (Math.random() - 0.5) * 2
  );
}

// ================================
// 3D SOLAR SYSTEM
// ================================

const solarGroup = new THREE.Group();
scene.add(solarGroup);

const sun = new THREE.Mesh(
  new THREE.SphereGeometry(0.55, 32, 32),
  new THREE.MeshBasicMaterial({ color: 0xffb52e })
);

solarGroup.add(sun);

const sunGlow = new THREE.PointLight(0xffa52e, 5, 15);
solarGroup.add(sunGlow);

const planets = [];

const planetData = [
  { name: "mercury", radius: 0.10, orbit: 0.95, speed: 1.8, color: 0xaaaaaa },
  { name: "venus", radius: 0.17, orbit: 1.45, speed: 1.2, color: 0xffc28b },
  { name: "earth", radius: 0.19, orbit: 2.05, speed: 0.9, color: 0x268aff },
  { name: "mars", radius: 0.14, orbit: 2.65, speed: 0.7, color: 0xff5533 },
  { name: "jupiter", radius: 0.34, orbit: 3.45, speed: 0.45, color: 0xd9a16f },
  { name: "saturn", radius: 0.28, orbit: 4.2, speed: 0.32, color: 0xe6d19b }
];

planetData.forEach((data, index) => {
  const planet = new THREE.Mesh(
    new THREE.SphereGeometry(data.radius, 24, 24),
    new THREE.MeshStandardMaterial({
      color: data.color,
      roughness: 0.65,
      metalness: 0.15,
      emissive: data.color,
      emissiveIntensity: 0.12
    })
  );

  solarGroup.add(planet);

  const orbitPoints = [];

  for (let i = 0; i <= 100; i++) {
    const angle = (i / 100) * Math.PI * 2;

    orbitPoints.push(
      new THREE.Vector3(
        Math.cos(angle) * data.orbit,
        0,
        Math.sin(angle) * data.orbit
      )
    );
  }

  const orbit = new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints(orbitPoints),
    new THREE.LineBasicMaterial({
      color: 0x6653a8,
      transparent: true,
      opacity: 0.55
    })
  );

  solarGroup.add(orbit);

  if (index === 5) {
    const ring = new THREE.Mesh(
      new THREE.TorusGeometry(0.42, 0.035, 8, 48),
      new THREE.MeshBasicMaterial({ color: 0xd7c18b })
    );

    ring.rotation.x = Math.PI / 2.5;
    planet.add(ring);
  }

  planets.push({ mesh: planet, data });
});

solarGroup.visible = false;
solarGroup.scale.setScalar(0.9);

// ================================
// HAND SKELETON NEON
// ================================

const skeletonGroup = new THREE.Group();
scene.add(skeletonGroup);

const handJoints = [];

for (let i = 0; i < 21; i++) {
  const joint = new THREE.Mesh(
    new THREE.SphereGeometry(0.055, 12, 12),
    new THREE.MeshBasicMaterial({
      color: 0x54eaff
    })
  );

  skeletonGroup.add(joint);
  handJoints.push(joint);
}

const connections = [
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],
  [0,17]
];

const skeletonLines = [];

connections.forEach(() => {
  const geometry = new THREE.BufferGeometry();
  const line = new THREE.Line(
    geometry,
    new THREE.LineBasicMaterial({
      color: 0x00eaff,
      transparent: true,
      opacity: 0.9
    })
  );

  skeletonGroup.add(line);
  skeletonLines.push(line);
});

// ================================
// PALM HOLOGRAM
// ================================

const hologram = new THREE.Group();
scene.add(hologram);

const holoRing1 = new THREE.Mesh(
  new THREE.TorusGeometry(0.65, 0.018, 8, 80),
  new THREE.MeshBasicMaterial({
    color: 0x00eaff,
    transparent: true,
    opacity: 0.9
  })
);

const holoRing2 = new THREE.Mesh(
  new THREE.TorusGeometry(0.45, 0.012, 8, 80),
  new THREE.MeshBasicMaterial({
    color: 0x9c63ff,
    transparent: true,
    opacity: 0.9
  })
);

const holoCore = new THREE.Mesh(
  new THREE.IcosahedronGeometry(0.22, 1),
  new THREE.MeshBasicMaterial({
    color: 0x8dffff,
    wireframe: true
  })
);

hologram.add(holoRing1, holoRing2, holoCore);

const holoBeam = new THREE.Mesh(
  new THREE.CylinderGeometry(0.025, 0.18, 1.1, 16, 1, true),
  new THREE.MeshBasicMaterial({
    color: 0x32dfff,
    transparent: true,
    opacity: 0.2,
    side: THREE.DoubleSide
  })
);

holoBeam.position.y = -0.55;
hologram.add(holoBeam);

hologram.visible = false;

// ================================
// EXPLOSION EFFECT
// ================================

let explosionPower = 0;

function triggerExplosion() {
  const now = performance.now();

  if (now - lastExplosion < 900) return;

  lastExplosion = now;
  explosionPower = 1;

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const direction = new THREE.Vector3(
      Math.random() - 0.5,
      Math.random() - 0.5,
      Math.random() - 0.5
    ).normalize();

    velocities[i].copy(direction).multiplyScalar(
      0.08 + Math.random() * 0.22
    );
  }
}

// ================================
// MODE CONTROL
// ================================

function setMode(mode) {
  currentMode = mode;

  document.querySelectorAll("[data-mode]").forEach(btn => {
    btn.classList.toggle(
      "active",
      btn.dataset.mode === mode
    );
  });

  solarGroup.visible = mode === "solar";
  particleSystem.visible = mode !== "solar";

  status.textContent = "MODE: " + mode.toUpperCase();
}

document.querySelectorAll("[data-mode]").forEach(btn => {
  btn.addEventListener("click", () => {
    setMode(btn.dataset.mode);
  });
});

document.getElementById("skeletonBtn").onclick = function() {
  skeletonEnabled = !skeletonEnabled;
  skeletonGroup.visible = skeletonEnabled && handDetected;
  this.classList.toggle("active", skeletonEnabled);
  this.textContent = skeletonEnabled ? "SKELETON ON" : "SKELETON OFF";
};

document.getElementById("holoBtn").onclick = function() {
  hologramEnabled = !hologramEnabled;
  hologram.visible = hologramEnabled && handDetected;
  this.classList.toggle("active", hologramEnabled);
  this.textContent = hologramEnabled ? "HOLOGRAM ON" : "HOLOGRAM OFF";
};

// ================================
// HAND POSITION CONVERSION
// ================================

function landmarkToWorld(lm) {
  const x = (0.5 - lm.x) * 10;
  const y = (0.5 - lm.y) * 7;

  return new THREE.Vector3(x, y, 0);
}

function isFingerUp(lm, tip, pip) {
  return lm[tip].y < lm[pip].y;
}

function detectGesture(lm) {
  const index = isFingerUp(lm, 8, 6);
  const middle = isFingerUp(lm, 12, 10);
  const ring = isFingerUp(lm, 16, 14);
  const pinky = isFingerUp(lm, 20, 18);

  const thumbTip = lm[4];
  const indexTip = lm[8];

  const pinchDistance = Math.hypot(
    thumbTip.x - indexTip.x,
    thumbTip.y - indexTip.y
  );

  if (pinchDistance < 0.055) return "pinch";

  if (index && middle && ring && pinky) return "open";
  if (!index && !middle && !ring && !pinky) return "fist";
  if (index && middle && !ring && !pinky) return "peace";
  if (index && !middle && !ring && !pinky) return "point";

  return "normal";
}

// ================================
// HAND TRACKING UPDATE
// ================================

function updateHand(lm) {
  handDetected = true;

  const palm = landmarkToWorld(lm[9]);

  handX = THREE.MathUtils.clamp(palm.x, -4.5, 4.5);
  handY = THREE.MathUtils.clamp(palm.y, -3, 3);

  const palmWidth = Math.hypot(
    lm[5].x - lm[17].x,
    lm[5].y - lm[17].y
  );

  handScale = THREE.MathUtils.clamp(
    palmWidth * 8,
    0.65,
    1.6
  );

  const gesture = detectGesture(lm);

  if (gesture === "open" && previousGesture !== "open") {
    triggerExplosion();
  }

  if (
    gesture === "peace" &&
    previousGesture !== "peace" &&
    performance.now() - lastModeChange > 1200
  ) {
    const modes = ["space", "saturn", "love", "heart", "solar"];
    const next = (modes.indexOf(currentMode) + 1) % modes.length;

    setMode(modes[next]);
    lastModeChange = performance.now();
  }

  previousGesture = gesture;

  if (gesture === "pinch") {
    status.textContent = "PINCH: ZOOM CONTROL";
  } else if (gesture === "fist") {
    status.textContent = "FIST: PARTICLE ATTRACT";
  } else if (gesture === "open") {
    status.textContent = "OPEN PALM: ENERGY EXPLOSION";
  } else {
    status.textContent = "HAND TRACKING ACTIVE";
  }

  // Skeleton
  skeletonGroup.visible = skeletonEnabled;

  if (skeletonEnabled) {
    const points = lm.map(landmarkToWorld);

    for (let i = 0; i < 21; i++) {
      handJoints[i].position.copy(points[i]);
    }

    connections.forEach((pair, i) => {
      const linePoints = [
        points[pair[0]],
        points[pair[1]]
      ];

      skeletonLines[i].geometry.dispose();
      skeletonLines[i].geometry =
        new THREE.BufferGeometry().setFromPoints(linePoints);
    });
  }

  // Hologram
  hologram.visible = hologramEnabled;

  if (hologramEnabled) {
    hologram.position.set(handX, handY, 0.4);
    hologram.scale.setScalar(handScale);
  }
}

// ================================
// CAMERA START
// ================================

async function startCamera() {
  if (cameraRunning) return;

  try {
    if (!window.isSecureContext) {
      throw new Error("Buka halaman melalui HTTPS, bukan file lokal.");
    }

    if (!navigator.mediaDevices?.getUserMedia) {
      throw new Error("Browser tidak mendukung akses kamera.");
    }

    status.textContent = "MEMINTA IZIN KAMERA...";
    startButton.textContent = "MENYIAPKAN...";

    cameraStream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: "user",
        width: { ideal: 640 },
        height: { ideal: 480 }
      }
    });

    video.srcObject = cameraStream;
    await video.play();

    status.textContent = "MEMUAT AI HAND TRACKING...";

    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );

    try {
      handLandmarker = await HandLandmarker.createFromOptions(
        vision,
        {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numHands: 1
        }
      );
    } catch (gpuError) {
      console.warn("GPU tidak tersedia, mencoba CPU", gpuError);

      handLandmarker = await HandLandmarker.createFromOptions(
        vision,
        {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
            delegate: "CPU"
          },
          runningMode: "VIDEO",
          numHands: 1
        }
      );
    }

    cameraRunning = true;
    startButton.classList.add("hidden");
    status.textContent = "SENKO AI ONLINE";

    detectLoop();

  } catch (error) {
    console.error(error);

    status.textContent = "ERROR: " + error.message;
    startButton.textContent = "COBA LAGI";
    startButton.classList.remove("hidden");

    if (cameraStream) {
      cameraStream.getTracks().forEach(track => track.stop());
      cameraStream = null;
    }

    cameraRunning = false;
  }
}

startButton.addEventListener("click", startCamera);

// ================================
// AI DETECTION LOOP
// ================================

function detectLoop() {
  if (!cameraRunning) return;

  if (
    video.readyState >= 2 &&
    video.currentTime !== lastVideoTime
  ) {
    lastVideoTime = video.currentTime;

    try {
      const result = handLandmarker.detectForVideo(
        video,
        performance.now()
      );

      if (result.landmarks && result.landmarks.length > 0) {
        updateHand(result.landmarks[0]);
      } else {
        handDetected = false;
        skeletonGroup.visible = false;
        hologram.visible = false;
        previousGesture = "";
        status.text
