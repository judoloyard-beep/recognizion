<body>

<div id="scene"></div>

<header>
  <h1>SENKO UNIVERSE</h1>
  <p>HAND INTERACTIVE EXPERIENCE V4</p>
</header>

<div id="status">✦ UNIVERSE READY</div>

  </div>

  </div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }

<script type="module">

import * as THREE from "three";

// ======================================
// ELEMENTS
// ======================================

const $ = id => document.getElementById(id);

const video = $("camera");
const status = $("status");
const gesture = $("gesture");
const startButton = $("start");

// ======================================
// SETTINGS
// ======================================

const COUNT = 850;
const BURST_COUNT = 180;
const OBJECT_RADIUS = 3.8;

let mode = 1;
let tracking = false;
let landmarker = null;
let stream = null;

let handDetected = false;

let handX = 0;
let handY = 0;
let handScale = 1;

let targetX = 0;
let targetY = 0;

let candidateMode = 1;
let candidateCount = 0;

let lastDetection = 0;
let lastVideoTime = -1;

const palette = {
  1: new THREE.Color(0x428aff),
  2: new THREE.Color(0xffa63b),
  3: new THREE.Color(0x16dfff),
  4: new THREE.Color(0xff267b)
};

// ======================================
// THREE JS
// ======================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x03030b);

const camera = new THREE.PerspectiveCamera(
  55,
  innerWidth / innerHeight,
  0.1,
  100
);

camera.position.z = 11;

const renderer = new THREE.WebGLRenderer({
  antialias: false,
  alpha: false,
  powerPreference: "high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1));

$("scene").appendChild(renderer.domElement);

const universe = new THREE.Group();
scene.add(universe);

// ======================================
// PARTICLE SYSTEM
// ======================================

let geometry;
let material;
let particles;

let positions;
let colors;

let targets = {};

function spherePoint(radius) {

  const theta = Math.random()*Math.PI*2;
  const z = Math.random()*2-1;
  const r = radius*Math.cbrt(Math.random());

  const s = Math.sqrt(1-z*z);

  return [
    r*s*Math.cos(theta),
    r*s*Math.sin(theta),
    r*z
  ];
}

// ======================================
// GENERATE SHAPES
// ======================================

function generateTargets() {

  const space = new Float32Array(COUNT*3);
  const saturn = new Float32Array(COUNT*3);
  const heart = new Float32Array(COUNT*3);
  const love = new Float32Array(COUNT*3);

  // LOVE TEXT

  const textCanvas = document.createElement("canvas");

  textCanvas.width = 1000;
  textCanvas.height = 250;

  const ctx = textCanvas.getContext("2d");

  ctx.fillStyle = "white";
  ctx.font = "bold 135px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  ctx.fillText("I LOVE YOU",500,125);

  const pixels = ctx.getImageData(
    0,0,1000,250
  ).data;

  const points = [];

  for(let y=0;y<250;y+=2) {
    for(let x=0;x<1000;x+=2) {

      if(pixels[(y*1000+x)*4+3]>100) {
        points.push([x,y]);
      }

    }
  }

  // GENERATE

  for(let i=0;i<COUNT;i++) {

    let p = spherePoint(3.6);

    space.set(p,i*3);

    // SATURN

    if(i<COUNT*0.65) {

      p = spherePoint(1.25);

    } else {

      const a = Math.random()*Math.PI*2;
      const r = 1.7+Math.random()*1.6;

      p = [
        Math.cos(a)*r,
        (Math.random()-0.5)*0.07,
        Math.sin(a)*r
      ];

    }

    saturn.set(p,i*3);

    // HEART

    const t = Math.random()*Math.PI*2;
    const scale = Math.sqrt(Math.random());

    const hx = 16*Math.pow(Math.sin(t),3);

    const hy =
      13*Math.cos(t)
      -5*Math.cos(2*t)
      -2*Math.cos(3*t)
      -Math.cos(4*t);

    heart.set([
      hx*scale*0.15,
      hy*scale*0.15,
      (Math.random()-0.5)*0.6
    ],i*3);

    // LOVE

    const textPoint = points[
      Math.floor(Math.random()*points.length)
    ];

    love.set([
      (textPoint[0]-500)*0.008,
      (125-textPoint[1])*0.008,
      (Math.random()-0.5)*0.12
    ],i*3);

  }

  targets = {
    space,
    saturn,
    heart,
    love
  };

  return space;
}

// ======================================
// CREATE PARTICLES
// ======================================

function createParticles() {

  const initial = generateTargets();

  positions = new Float32Array(initial);
  colors = new Float32Array(COUNT*3);

  geometry = new THREE.BufferGeometry();

  geometry.setAttribute(
    "position",
    new THREE.BufferAttribute(positions,3)
  );

  geometry.setAttribute(
    "color",
    new THREE.BufferAttribute(colors,3)
  );

  material = new THREE.PointsMaterial({

    size: 0.065,
    vertexColors: true,
    transparent: true,
    opacity: 0.95,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
    sizeAttenuation: true

  });

  particles = new THREE.Points(geometry,material);

  universe.add(particles);

  updateColors();

}

// ======================================
// BACKGROUND STARS
// ======================================

const starPositions = [];

for(let i=0;i<350;i++) {

  starPositions.push(
    (Math.random()-0.5)*35,
    (Math.random()-0.5)*25,
    -5-Math.random()*15
  );

}

const starGeometry = new THREE.BufferGeometry();

starGeometry.setAttribute(
  "position",
  new THREE.Float32BufferAttribute(starPositions,3)
);

const starMaterial = new THREE.PointsMaterial({

  color: 0x8a6dff,
  size: 0.045,
  transparent: true,
  opacity: 0.7

});

const stars = new THREE.Points(
  starGeometry,
  starMaterial
);

scene.add(stars);

// ======================================
// COLORS
// ======================================

function updateColors() {

  const base = palette[mode];

  for(let i=0;i<COUNT;i++) {

    const factor = 0.65+Math.random()*0.35;

    const color =
      mode===2 && i>=COUNT*0.65
      ? new THREE.Color(0xffc06a)
      : base;

    colors[i*3] = color.r*factor;
    colors[i*3+1] = color.g*factor;
    colors[i*3+2] = color.b*factor;

  }

  geometry.attributes.color.needsUpdate = true;

}

// ======================================
// PARTICLE EXPLOSION
// ======================================

const burstPositions = new Float32Array(BURST_COUNT*3);
const burstVelocity = new Float32Array(BURST_COUNT*3);

const burstGeometry = new THREE.BufferGeometry();

burstGeometry.setAttribute(
  "position",
  new THREE.BufferAttribute(burstPositions,3)
);

const burstMaterial = new THREE.PointsMaterial({

  color: 0xd5a1ff,
  size: 0.085,
  transparent: true,
  opacity: 0,
  blending: THREE.AdditiveBlending,
  depthWrite: false

});

const burst = new THREE.Points(
  burstGeometry,
  burstMaterial
);

universe.add(burst);

let burstLife = 0;

function explode() {

  burstLife = 1;

  for(let i=0;i<BURST_COUNT;i++) {

    const a = Math.random()*Math.PI*2;
    const z = Math.random()*2-1;
    const r = Math.sqrt(1-z*z);

    burstPositions[i*3] = 0;
    burstPositions[i*3+1] = 0;
    burstPositions[i*3+2] = 0;

    const speed = 2+Math.random()*5;

    burstVelocity[i*3] = Math.cos(a)*r*speed;
    burstVelocity[i*3+1] = Math.sin(a)*r*speed;
    burstVelocity[i*3+2] = z*speed;

  }

  burstGeometry.attributes.position.needsUpdate = true;

}

// ======================================
// MODE SYSTEM
// ======================================

const targetNames = {
  1: "COSMIC UNIVERSE",
  2: "SATURN 3D",
  3: "I LOVE YOU",
  4: "HEART 3D"
};

const targetData = {
  1: "space",
  2: "saturn",
  3: "love",
  4: "heart"
};

function setMode(next) {

  if(next===mode) return;

  mode = next;

  updateColors();
  explode();

  status.textContent = "✦ "+targetNames[mode];

  document.querySelectorAll("[data-mode]").forEach(btn=>{

    btn.classList.toggle(
      "active",
      Number(btn.dataset.mode)===mode
    );

  });

}

document.querySelectorAll("[data-mode]").forEach(btn=>{

  btn.addEventListener("click",()=>{

    setMode(Number(btn.dataset.mode));

  });

});

// ======================================
// GESTURE DETECTION
// ======================================

function detectGesture(lm) {

  const tips = [8,12,16,20];
  const pips = [6,10,14,18];

  const fingers = tips.map((tip,i)=>{

    return lm[tip].y < lm[pips[i]].y;

  });

  if(fingers.every(v=>!v)) return 4;

  if(
    fingers[0] &&
    !fingers[1] &&
    !fingers[2] &&
    !fingers[3]
  ) return 2;

  if(
    fingers[0] &&
    fingers[1] &&
    !fingers[2] &&
    !fingers[3]
  ) return 3;

  if(fingers.every(v=>v)) return 1;

  return mode;

}

// ======================================
// SCREEN BOUNDARY SYSTEM
// ======================================

function getScreenLimits(scale) {

  const height = 2 * camera.position.z *
    Math.tan(THREE.MathUtils.degToRad(55/2));

  const width = height * camera.aspect;

  const margin = OBJECT_RADIUS*scale+0.25;

  return {

    x: Math.max(0,width/2-margin),
    y: Math.max(0,height/2-margin)

  };

}

function getFitScale() {

  const height = 2 * camera.position.z *
    Math.tan(THREE.MathUtils.degToRad(55/2));

  const width = height * camera.aspect;

  const fitX = (width-0.5)/(OBJECT_RADIUS*2);
  const fitY = (height-0.5)/(OBJECT_RADIUS*2);

  return THREE.MathUtils.clamp(
    Math.min(1,fitX,fitY),
    0.35,
    1
  );

}

// ======================================
// CAMERA + MEDIAPIPE
// ======================================

async function startTracking() {

  if(!navigator.mediaDevices?.getUserMedia) {

    status.textContent = "BUKA WEBSITE MELALUI HTTPS";
    return;

  }

  startButton.disabled = true;
  startButton.textContent = "MEMUAT KAMERA...";

  try {

    stream = await navigator.mediaDevices.getUserMedia({

      audio: false,

      video: {

        facingMode: "user",
        width: {ideal:320},
        height: {ideal:240},
        frameRate: {ideal:20,max:20}

      }

    });

    video.srcObject = stream;

    await video.play();

    const vision = await import(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14"
    );

    const fileset =
      await vision.FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

    const options = {

      baseOptions: {

        modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

        delegate: "GPU"

      },

      runningMode: "VIDEO",
      numHands: 1,

      minHandDetectionConfidence: 0.55,
      minHandPresenceConfidence: 0.55,
      minTrackingConfidence: 0.55

    };

    try {

      landmarker =
        await vision.HandLandmarker.createFromOptions(
          fileset,
          options
        );

    } catch(gpuError) {

      console.warn("Mencoba CPU",gpuError);

      options.baseOptions.delegate = "CPU";

      landmarker =
        await vision.HandLandmarker.createFromOptions(
          fileset,
          options
        );

    }

    tracking = true;

    handDetected = false;

    status.textContent = "✦ HAND TRACKING ACTIVE";

    $("camLabel").textContent = "CAMERA ACTIVE";

    startButton.textContent = "KAMERA AKTIF";

    requestAnimationFrame(trackHands);

  } catch(error) {

    console.error(error);

    status.textContent = "GAGAL MEMUAT KAMERA";

    gesture.textContent =
      "Periksa izin kamera dan koneksi internet";

    startButton.disabled = false;
    startButton.textContent = "COBA LAGI";

    if(stream) {

      stream.getTracks().forEach(track=>track.stop());

      stream = null;

    }

  }

}

// ======================================
// HAND TRACKING LOOP
// ======================================

function trackHands(now) {

  if(!tracking) return;

  requestAnimationFrame(trackHands);

  // 20 FPS DETECTION

  if(now-lastDetection<50) return;

  if(video.readyState<2) return;

  if(video.currentTime===lastVideoTime) return;

  lastDetection = now;
  lastVideoTime = video.currentTime;

  try {

    const result = landmarker.detectForVideo(video,now);

    if(result.landmarks?.length) {

      const lm = result.landmarks[0];

      handDetected = true;

      // GESTURE

      const detected = detectGesture(lm);

      if(detected===candidateMode) {

        candidateCount++;

      } else {

        candidateMode = detected;
        candidateCount = 0;

      }

      if(candidateCount>=3) {

        setMode(detected);

      }

      // CENTER OF PALM

      const palm = lm[9];

      // NORMALIZED SCREEN COORDINATES

      const rawX = (0.5-palm.x)*9;
      const rawY = (0.5-palm.y)*7;

      // PALM SIZE

      const palmWidth = Math.hypot(
        lm[5].x-lm[17].x,
        lm[5].y-lm[17].y
      );

      const wantedScale = THREE.MathUtils.clamp(
        0.11/(palmWidth+0.001),
        0.65,
        1.1
      );

      handScale +=
        (wantedScale-handScale)*0.12;

      // LIMIT OBJECT TO SCREEN

      const fitScale = getFitScale();

      const finalScale = Math.min(
        handScale,
        fitScale
      );

      const limits = getScreenLimits(finalScale);

      targetX = THREE.MathUtils.clamp(
        rawX,
        -limits.x,
        limits.x
      );

      targetY = THREE.MathUtils.clamp(
        rawY,
        -limits.y,
        limits.y
      );

      // GESTURE LABEL

      const names = {

        1: "✋ TELAPAK TERBUKA | SPACE",
        2: "☝️ TELUNJUK | SATURN",
        3: "✌️ PEACE | LOVE",
        4: "✊ GENGGAM | HEART"

      };

      gesture.textContent = names[detected];

      status.textContent = "✦ HAND DETECTED";

    } else {

      // IMPORTANT:
      // JANGAN RESET POSISI SAAT TANGAN HILANG

      handDetected = false;

      candidateCount = 0;

      gesture.textContent = "MENUNGGU TANGAN...";

      status.textContent = "✦ SEARCHING HAND";

    }

  } catch(error) {

    console.warn("Tracking error",error);

  }

}

startButton.addEventListener("click",startTracking);

// ======================================
// ANIMATION
// ======================================

const clock = new THREE.Clock();

function animate() {

  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(),0.04);
  const elapsed = clock.elapsedTime;

  // PARTICLE MORPHING

  const current = geometry.attributes.position.array;

  const target = targets[targetData[mode]];

  const smooth = 1-Math.pow(0.001,dt);

  for(let i=0;i<COUNT;i++) {

    const j = i*3;

    current[j] +=
      (target[j]-current[j])*smooth;

    current[j+1] +=
      (target[j+1]-current[j+1])*smooth;

    current[j+2] +=
      (target[j+2]-current[j+2])*smooth;

  }

  geometry.attributes.position.needsUpdate = true;

  // ==================================
  // STABLE HAND FOLLOW
  // ==================================

  const fitScale = getFitScale();

  const finalScale = Math.min(
    handScale,
    fitScale
  );

  universe.scale.setScalar(finalScale);

  if(handDetected) {

    const limits = getScreenLimits(finalScale);

    const safeX = THREE.MathUtils.clamp(
      targetX,
      -limits.x,
      limits.x
    );

    const safeY = THREE.MathUtils.clamp(
      targetY,
      -limits.y,
      limits.y
    );

    // SMOOTH MOVEMENT

    const follow = 1-Math.pow(0.001,dt);

    handX += (safeX-handX)*follow;
    handY += (safeY-handY)*follow;

    universe.position.x = handX;
    universe.position.y = handY;

  }

  // WHEN HAND DISAPPEARS:
  // KEEP LAST POSITION

  // ==================================
  // ROTATION
  // ==================================

  universe.rotation.y += dt*0.3;

  if(mode===2) {

    universe.rotation.x = 0.35;
    universe.rotation.z = 0.1;

  } else {

    universe.rotation.x =
      Math.sin(elapsed*0.3)*0.08;

    universe.rotation.z = 0;

  }

  // ==================================
  // PARTICLE BURST
  // ==================================

  if(burstLife>0) {

    burstLife -= dt*1.5;

    for(let i=0;i<BURST_COUNT;i++) {

      const j=i*3;

      burstPositions[j] +=
        burstVelocity[j]*dt;

      burstPositions[j+1] +=
        burstVelocity[j+1]*dt;

      burstPositions[j+2] +=
        burstVelocity[j+2]*dt;

    }

    burstGeometry.attributes.position.needsUpdate = true;

    burstMaterial.opacity = Math.max(0,burstLife);

  } else {

    burstMaterial.opacity = 0;

  }

  // BACKGROUND

  stars.rotation.y += dt*0.015;

  renderer.render(scene,camera);

}

// ======================================
// INITIALIZE
// ======================================

createParticles();

animate();

// ======================================
// RESIZE
// =====================
