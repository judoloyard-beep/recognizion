
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SENKO UNIVERSE V6</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{overflow:hidden;background:#02030a;color:white;font-family:Arial,sans-serif}
canvas{display:block}
#ui{position:fixed;inset:0;z-index:5;pointer-events:none}
.header{position:absolute;top:18px;width:100%;text-align:center}
.header h1{font-size:21px;letter-spacing:5px;color:#c4adff;text-shadow:0 0 15px #895cff}
.header p{font-size:10px;letter-spacing:3px;color:#999;margin-top:6px}
#status{position:absolute;top:83px;left:50%;transform:translateX(-50%);background:#100d22dd;border:1px solid #7051bd;border-radius:30px;padding:8px 13px;font-size:10px;color:#d7c8ff;white-space:nowrap;max-width:90%;overflow:hidden}
button{pointer-events:auto;border:1px solid #7654c2;background:#100d24ed;color:#e0d5ff;padding:10px 12px;border-radius:10px;font-size:10px;letter-spacing:.5px}
button.active{background:#7046d9;color:white;box-shadow:0 0 12px #7849ff}
#start{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);padding:16px 24px;background:#7046d9;color:white;border:1px solid #c5aaff;font-size:12px;z-index:10}
#controls{position:absolute;bottom:18px;left:0;width:100%;display:flex;flex-wrap:wrap;justify-content:center;gap:7px;padding:0 9px;pointer-events:auto}
#cameraBox{position:absolute;right:12px;bottom:125px;width:110px;height:82px;border:1px solid #805bd0;border-radius:10px;overflow:hidden;background:#080612}
#video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
#help{position:absolute;bottom:128px;left:12px;font-size:9px;line-height:1.8;color:#c2b8e4;text-shadow:0 0 8px black}
.hidden{display:none!important}
</style>
</head>

<body>

<div id="ui">
  <div class="header">
    <h1>SENKO UNIVERSE</h1>
    <p>HAND CONTROL SYSTEM V6</p>
  </div>

  <div id="status">SYSTEM READY</div>

  <button id="start">✦ AKTIFKAN KAMERA</button>

  <div id="help">
    ✋ OPEN PALM : EXPLOSION<br>
    ✊ FIST : ATTRACT<br>
    🤏 PINCH : ZOOM<br>
    ✌️ PEACE : CHANGE MODE
  </div>

  <div id="cameraBox">
    <video id="video" autoplay playsinline muted></video>
  </div>

  <div id="controls">
    <button class="active" data-mode="space">SPACE</button>
    <button data-mode="saturn">SATURN</button>
    <button data-mode="love">LOVE</button>
    <button data-mode="heart">HEART</button>
    <button data-mode="solar">SOLAR SYSTEM</button>
    <button id="skeletonBtn" class="active">SKELETON ON</button>
    <button id="holoBtn" class="active">HOLOGRAM ON</button>
  </div>
</div>

<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";
import {FilesetResolver,HandLandmarker} from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const $=id=>document.getElementById(id);
const status=$("status");
const video=$("video");
const startButton=$("start");

let landmarker=null;
let stream=null;
let cameraRunning=false;
let cameraStarting=false;
let lastVideoTime=-1;

let mode="space";
let gesture="normal";
let previousGesture="";
let handDetected=false;
let handX=0,handY=0,handScale=1;
let skeletonEnabled=true,holoEnabled=true;
let lastModeChange=0,lastExplosion=0;
let explosionPower=0;

// ===============================
// THREE.JS
// ===============================

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x02030a);

const camera=new THREE.PerspectiveCamera(
  60,innerWidth/innerHeight,.1,1000
);
camera.position.set(0,0,11);

const renderer=new THREE.WebGLRenderer({
  antialias:true,
  alpha:false
});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,1.4));

const light=new THREE.PointLight(0x9c72ff,4,30);
light.position.set(0,3,7);
scene.add(light);

// ===============================
// STARS
// ===============================

const starPos=new Float32Array(1200*3);

for(let i=0;i<1200;i++){
  starPos[i*3]=(Math.random()-.5)*90;
  starPos[i*3+1]=(Math.random()-.5)*70;
  starPos[i*3+2]=(Math.random()-.5)*50;
}

const starGeo=new THREE.BufferGeometry();
starGeo.setAttribute("position",new THREE.BufferAttribute(starPos,3));

const stars=new THREE.Points(
  starGeo,
  new THREE.PointsMaterial({
    color:0x9d8aff,
    size:.06,
    transparent:true,
    opacity:.8
  })
);
scene.add(stars);

// ===============================
// PARTICLES
// ===============================

const COUNT=1400;
const positions=new Float32Array(COUNT*3);
const colors=new Float32Array(COUNT*3);
const velocities=[];
const seeds=[];

for(let i=0;i<COUNT;i++){
  positions[i*3]=(Math.random()-.5)*8;
  positions[i*3+1]=(Math.random()-.5)*6;
  positions[i*3+2]=(Math.random()-.5)*3;

  colors[i*3]=.55+Math.random()*.4;
  colors[i*3+1]=.3+Math.random()*.5;
  colors[i*3+2]=1;

  velocities.push(new THREE.Vector3());
  seeds.push(Math.random()*Math.PI*2);
}

const particleGeo=new THREE.BufferGeometry();
particleGeo.setAttribute("position",new THREE.BufferAttribute(positions,3));
particleGeo.setAttribute("color",new THREE.BufferAttribute(colors,3));

const particleSystem=new THREE.Points(
  particleGeo,
  new THREE.PointsMaterial({
    size:.05,
    vertexColors:true,
    transparent:true,
    opacity:.95,
    blending:THREE.AdditiveBlending,
    depthWrite:false
  })
);
scene.add(particleSystem);

// Stable target positions
function targetPosition(i,t){
  const a=i*2.399963+seeds[i];
  const r=1.3+(i%100)/45;

  if(mode==="space"){
    return [
      Math.cos(a+t*.12)*r,
      Math.sin(a+t*.12)*r,
      Math.sin(a*.7)*1.5
    ];
  }

  if(mode==="saturn"){
    if(i<COUNT*.45){
      const u=i/(COUNT*.45);
      const phi=Math.acos(2*u-1);
      return [
        1.1*Math.sin(phi)*Math.cos(a),
        1.1*Math.cos(phi),
        1.1*Math.sin(phi)*Math.sin(a)
      ];
    }

    const angle=a+t*.25;
    const radius=1.6+(i%100)/80;
    return [
      Math.cos(angle)*radius,
      Math.sin(angle)*radius*.3,
      Math.sin(angle)*.4
    ];
  }

  if(mode==="love"){
    return [
      Math.cos(a)*1.4,
      Math.sin(a)*1.4,
      Math.sin(a*2)*.6
    ];
  }

  if(mode==="heart"){
    const x=.16*Math.pow(Math.sin(a),3)*10;
    const y=(
      .13*Math.cos(a)-
      .05*Math.cos(2*a)-
      .02*Math.cos(3*a)-
      .01*Math.cos(4*a)
    )*10;

    return [x*.55,y*.55,Math.sin(a*3)*.5];
  }

  return [Math.cos(a)*1.5,Math.sin(a)*1.5,0];
}

// ===============================
// SOLAR SYSTEM
// ===============================

const solar=new THREE.Group();
scene.add(solar);
solar.visible=false;

const sun=new THREE.Mesh(
  new THREE.SphereGeometry(.5,32,32),
  new THREE.MeshBasicMaterial({color:0xffb52e})
);
solar.add(sun);

const sunLight=new THREE.PointLight(0xffa52e,5,15);
solar.add(sunLight);

const planetData=[
  [.10,.95,1.8,0xaaaaaa],
  [.17,1.45,1.2,0xffc28b],
  [.19,2.05,.9,0x268aff],
  [.14,2.65,.7,0xff5533],
  [.34,3.45,.45,0xd9a16f],
  [.28,4.2,.32,0xe6d19b]
];

const planets=[];

planetData.forEach((d,index)=>{
  const mesh=new THREE.Mesh(
    new THREE.SphereGeometry(d[0],24,24),
    new THREE.MeshStandardMaterial({
      color:d[3],
      emissive:d[3],
      emissiveIntensity:.12,
      roughness:.6
    })
  );
  solar.add(mesh);

  const points=[];
  for(let j=0;j<=100;j++){
    const a=j/100*Math.PI*2;
    points.push(new THREE.Vector3(
      Math.cos(a)*d[1],0,Math.sin(a)*d[1]
    ));
  }

  solar.add(new THREE.LineLoop(
    new THREE.BufferGeometry().setFromPoints(points),
    new THREE.LineBasicMaterial({
      color:0x6653a8,
      transparent:true,
      opacity:.5
    })
  ));

  if(index===5){
    const ring=new THREE.Mesh(
      new THREE.TorusGeometry(.42,.035,8,48),
      new THREE.MeshBasicMaterial({color:0xd7c18b})
    );
    ring.rotation.x=Math.PI/2.5;
    mesh.add(ring);
  }

  planets.push({mesh,data:d});
});

// ===============================
// NEON HAND SKELETON
// ===============================

const skeleton=new THREE.Group();
scene.add(skeleton);
skeleton.visible=false;

const joints=[];

for(let i=0;i<21;i++){
  const joint=new THREE.Mesh(
    new THREE.SphereGeometry(.055,12,12),
    new THREE.MeshBasicMaterial({color:0x54eaff})
  );
  skeleton.add(joint);
  joints.push(joint);
}

const connections=[
  [0,1],[1,2],[2,3],[3,4],
  [0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],
  [9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],[0,17]
];

const boneLines=[];

connections.forEach(()=>{
  const geometry=new THREE.BufferGeometry();
  const material=new THREE.LineBasicMaterial({
    color:0x00eaff,
    transparent:true,
    opacity:.9
  });
  const line=new THREE.Line(geometry,material);
  skeleton.add(line);
  boneLines.push(line);
});

// ===============================
// PALM HOLOGRAM
// ===============================

const hologram=new THREE.Group();
scene.add(hologram);
hologram.visible=false;

const ring1=new THREE.Mesh(
  new THREE.TorusGeometry(.65,.018,8,80),
  new THREE.MeshBasicMaterial({color:0x00eaff})
);
const ring2=new THREE.Mesh(
  new THREE.TorusGeometry(.45,.012,8,80),
  new THREE.MeshBasicMaterial({color:0x9c63ff})
);
const core=new THREE.Mesh(
  new THREE.IcosahedronGeometry(.22,1),
  new THREE.MeshBasicMaterial({
    color:0x8dffff,
    wireframe:true
  })
);
const beam=new THREE.Mesh(
  new THREE.CylinderGeometry(.025,.18,1.1,16,1,true),
  new THREE.MeshBasicMaterial({
    color:0x32dfff,
    transparent:true,
    opacity:.2,
    side:THREE.DoubleSide
  })
);
beam.position.y=-.55;
hologram.add(ring1,ring2,core,beam);

// ===============================
// MODE
// ===============================

function setMode(next){
  mode=next;
  particleSystem.visible=next!=="solar";
  solar.visible=next==="solar";

  document.querySelectorAll("[data-mode]").forEach(button=>{
    button.classList.toggle("active",button.dataset.mode===next);
  });

  status.textContent="MODE: "+next.toUpperCase();
}

document.querySelectorAll("[data-mode]").forEach(button=>{
  button.addEventListener("click",()=>{
    setMode(button.dataset.mode);
  });
});

$("skeletonBtn").addEventListener("click",()=>{
  skeletonEnabled=!skeletonEnabled;
  $("skeletonBtn").textContent=skeletonEnabled?"SKELETON ON":"SKELETON OFF";
  $("skeletonBtn").classList.toggle("active",skeletonEnabled);
  skeleton.visible=skeletonEnabled&&handDetected;
});

$("holoBtn").addEventListener("click",()=>{
  holoEnabled=!holoEnabled;
  $("holoBtn").textContent=holoEnabled?"HOLOGRAM ON":"HOLOGRAM OFF";
  $("holoBtn").classList.toggle("active",holoEnabled);
  hologram.visible=holoEnabled&&handDetected;
});

// ===============================
// GESTURES
// ===============================

function worldPoint(lm){
  return new THREE.Vector3(
    (0.5-lm.x)*10,
    (0.5-lm.y)*7,
    0
  );
}

function fingerUp(lm,tip,pip){
  return lm[tip].y<lm[pip].y;
}

function detectGesture(lm){
  const index=fingerUp(lm,8,6);
  const middle=fingerUp(lm,12,10);
  const ring=fingerUp(lm,16,14);
  const pinky=fingerUp(lm,20,18);

  const pinch=Math.hypot(
    lm[4].x-lm[8].x,
    lm[4].y-lm[8].y
  );

  if(pinch<.055)return "pinch";
  if(index&&middle&&ring&&pinky)return "open";
  if(!index&&!middle&&!ring&&!pinky)return "fist";
  if(index&&middle&&!ring&&!pinky)return "peace";
  return "normal";
}

function explode(){
  const now=performance.now();
  if(now-lastExplosion<1000)return;

  lastExplosion=now;
  explosionPower=1;

  for(let i=0;i<COUNT;i++){
    const v=new THREE.Vector3(
      Math.random()-.5,
      Math.random()-.5,
      Math.random()-.5
    ).normalize();

    velocities[i].copy(v).multiplyScalar(
      .1+Math.random()*.25
    );
  }
}

function updateHand(lm){
  handDetected=true;

  const palm=worldPoint(lm[9]);
  handX=THREE.MathUtils.clamp(palm.x,-4.5,4.5);
  handY=THREE.MathUtils.clamp(palm.y,-3,3);

  const width=Math.hypot(
    lm[5].x-lm[17].x,
    lm[5].y-lm[17].y
  );

  handScale=THREE.MathUtils.clamp(width*8,.65,1.6);

  gesture=detectGesture(lm);

  if(gesture==="open"&&previousGesture!=="open"){
    explode();
  }

  if(
    gesture==="peace"&&previousGesture!=="peace"&&
    performance.now()-lastModeChange>1200
  ){
    const modes=["space","saturn","love","heart","solar"];
    const next=(modes.indexOf(mode)+1)%modes.length;
    setMode(modes[next]);
    lastModeChange=performance.now();
  }

  previousGesture=gesture;

  if(gesture==="open")status.textContent="✋ ENERGY EXPLOSION";
  else if(gesture==="fist")status.textContent="✊ PARTICLE ATTRACT";
  else if(gesture==="pinch")status.textContent="🤏 ZOOM CONTROL";
  else status.textContent="HAND TRACKING ACTIVE";

  // Skeleton positions
  skeleton.visible=skeletonEnabled;

  if(skeletonEnabled){
    const points=lm.map(worldPoint);

    for(let i=0;i<21;i++){
      joints[i].position.copy(points[i]);
    }

    connections.forEach((pair,i)=>{
      const arr=boneLines[i].geometry.attributes.position;

      if(!arr||arr.count!==2){
        boneLines[i].geometry.dispose();
        boneLines[i].geometry=new THREE.BufferGeometry().setFromPoints([
          points[pair[0]],points[pair[1]]
        ]);
      }else{
        arr.setXYZ(0,points[pair[0]].x,points[pair[0]].y,points[pair[0]].z);
        arr.setXYZ(1,points[pair[1]].x,points[pair[1]].y,points[pair[1]].z);
        arr.needsUpdate=true;
      }
    });
  }

  // Palm hologram
  hologram.visible=holoEnabled;
  if(holoEnabled){
    hologram.position.set(handX,handY,.4);
    hologram.scale.setScalar(handScale);
  }
}

// ===============================
// CAMERA
// ===============================

async function startCamera(){
  if(cameraRunning||cameraStarting)return;

  cameraStarting=true;
  startButton.textContent="MEMUAT KAMERA...";
  status.textContent="MEMINTA IZIN KAMERA...";

  try{
    if(!window.isSecureContext){
      throw new Error("Gunakan HTTPS atau localhost.");
    }

    if(!navigator.mediaDevices?.getUserMedia){
      throw new Error("Browser tidak mendukung kamera.");
    }

    stream=await navigator.mediaDevices.getUserMedia({
      audio:false,
      video:{
        facingMode:"user",
        width:{ideal:480},
        height:{ideal:360}
      }
    });

    video.srcObject=stream;
    await video.play();

    status.textContent="MEMUAT MEDIAPIPE...";

    const vision=await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
    );

    const options={
      baseOptions:{
        modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate:"GPU"
      },
      runningMode:"VIDEO",
      numHands:1
    };

    try{
      landmarker=await HandLandmarker.createFromOptions(vision,options);
    }catch(gpuError){
      console.warn("GPU gagal, mencoba CPU",gpuError);
      options.baseOptions.delegate="CPU";
      landmarker=await HandLandmarker.createFromOptions(vision,options);
    }

    cameraRunning=true;
    startButton.classList.add("hidden");
    status.textContent="SENKO AI ONLINE";

    detectLoop();

  }catch(error){
    console.error(error);

    status.textContent="ERROR: "+error.message;
    startButton.textContent="COBA LAGI";
    startButton.classList.remove("hidden");

    if(stream){
      stream.getTracks().forEach(track=>track.stop());
      stream=null;
    }
  }finally{
    cameraStarting=false;
  }
}

startButton.addEventListener("click",startCamera);

// ===============================
// DETECTION LOOP
// ===============================

function detectLoop(){
  if(!cameraRunning)return;

  if(
    video.readyState>=2&&
    video.currentTime!==lastVideoTime
  ){
    lastVideoTime=video.currentTime;

    try{
      const result=landmarker.detectForVideo(
        video,performance.now()
      );

      if(result.landmarks&&result.landmarks.length){
        updateHand(result.landmarks[0]);
      }else{
        handDetected=false;
        previousGesture="";
        skeleton.visible=false;
        hologram.visible=false;
        status.textContent="TANGAN TIDAK TERDETEKSI";
      }
    }catch(error){
      console.warn("Detection:",error);
    }
  }

  requestAnimationFrame(detectLoop);
}

// ===============================
// ANIMATION
// ===============================

const clock=new THREE.Clock();

function animate(){
  requestAnimationFrame(animate);

  const t=clock.getElapsedTime();

  stars.rotation.y+=.0002;
  stars.rotation.x+=.00005;

  // Particles
  if(particleSystem.visible){
    for(let i=0;i<COUNT;i++){
      const idx=i*3;
      const target=targetPosition(i,t);

      let tx=target[0];
      let ty=target[1];
      let tz=target[2];

      if(handDetected){
        tx+=handX*.35;
        ty+=handY*.35;
      }

      if(gesture==="fist"&&handDetected){
        tx=handX+(tx-handX)*.2;
        ty=handY+(ty-handY)*.2;
      }

      if(gesture==="pinch"&&handDetected){
        tx*=handScale;
        ty*=handScale;
        tz*=handScale;
      }

      const p=positions;

      if(explosionPower>.01){
        velocities[i].multiplyScalar(.965);
        p[idx]+=velocities[i].x;
        p[idx+1]+=velocities[i].y;
        p[idx+2]+=velocities[i].z;

        p[idx]+=(tx-p[idx])*.008;
        p[idx+1]+=(ty-p[idx+1])*.008;
        p[idx+2]+=(tz-p[idx+2])*.008;
      }else{
        p[idx]+=(tx-p[idx])*.045;
        p[idx+1]+=(ty-p[idx+1])*.045;
        p[idx+2]+=(tz-p[idx+2])*.045;
      }
    }

    particleGeo.attributes.position.needsUpdate=true;
    explosionPower*=.94;
  }

  // Solar system
  if(solar.visible){
    solar.rotation.x=-.25;
    solar.rotation.y+=.002;

    planets.forEach(({mesh,data})=>{
      const angle=t*data[2];
      mesh.position.set(
        Math.cos(angle)*data[1],
        Math.sin(angle*.5)*.12,
        Math.sin(angle)*data[1]
      );
      mesh.rotation.y+=.01;
    });
  }

  // Hologram
  if(hologram.visible){
    ring1.rotation.z+=.015;
    ring2.rotation.z-=.02;
    core.rotation.x+=.015;
    core.rotation.y+=.02;
    beam.material.opacity=.12+Math.sin(t*4)*.08;
  }

  // Skeleton pulse
  if(skeleton.visible){
    const pulse=.8+Math.sin(t*5)*.2;
    joints.forEach(j=>j.scale.setScalar(pulse));
  }

  renderer.render(scene,camera);
}

animate();

// ===============================
// RESIZE
// ===============================

window.addEventListener("resize",()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
});

setMode("space");

</script>
</body>
</html>
