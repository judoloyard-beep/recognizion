
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>NEON BOXING AI</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
 background:#070812;color:white;
 font-family:Arial,sans-serif;
 overflow:hidden;
}
.app{
 height:100dvh;padding:14px;
 display:flex;flex-direction:column;gap:12px;
}
header{
 display:flex;justify-content:space-between;
 align-items:center;
}
.logo{font-size:20px;font-weight:bold;color:#bd72ff;letter-spacing:2px}
.status{font-size:10px;color:#00ffc3}
.arena{
 flex:1;min-height:0;position:relative;
 overflow:hidden;border-radius:18px;
 border:1px solid #8139c7;
 background:radial-gradient(ellipse,#25123e,#090a16 70%);
}
video,canvas{
 position:absolute;width:100%;height:100%;
 object-fit:cover;
}
video{opacity:.38;transform:scaleX(-1)}
canvas{transform:scaleX(-1)}
.enemy{
 position:absolute;left:50%;top:43%;
 transform:translate(-50%,-50%);
 text-align:center;pointer-events:none;
}
.enemy-icon{
 font-size:90px;
 filter:drop-shadow(0 0 15px #b34cff);
 animation:bob 1.5s infinite alternate;
}
.enemy-name{font-size:11px;color:#e3a5ff;letter-spacing:3px}
@keyframes bob{to{transform:translateY(-10px)}}
.hud{
 position:absolute;top:12px;left:12px;right:12px;
 display:flex;justify-content:space-between;
 gap:15px;pointer-events:none;
}
.health{width:45%}
.health span{font-size:10px;color:#ddd}
.bar{
 height:9px;background:#242039;
 border-radius:10px;margin-top:5px;overflow:hidden;
}
.fill{height:100%;width:100%;background:#a855f7;transition:width .2s}
.enemybar{background:#ff426d}
.stats{
 display:grid;grid-template-columns:repeat(3,1fr);
 gap:8px;
}
.stat{
 background:#141323;padding:12px 5px;
 border:1px solid #302345;border-radius:12px;
 text-align:center;
}
.stat small{display:block;color:#888;font-size:9px}
.stat b{display:block;margin-top:5px;color:#c084fc;font-size:16px}
.controls{display:flex;gap:9px}
button{
 flex:1;padding:15px;border:0;border-radius:12px;
 background:#9333ea;color:white;font-weight:bold;
}
.stop{background:#29263b}
.message{
 text-align:center;color:#aaa;font-size:11px;
}
</style>
</head>

<body>
<div class="app">

<header>
 <div class="logo">NEON BOXING</div>
 <div class="status" id="status">● WAITING</div>
</header>

<div class="arena">

 <video id="video" autoplay muted playsinline></video>
 <canvas id="canvas"></canvas>

 <div class="hud">
  <div class="health">
   <span>PLAYER HP</span>
   <div class="bar"><div class="fill" id="playerHP"></div></div>
  </div>
  <div class="health">
   <span>ENEMY HP</span>
   <div class="bar"><div class="fill enemybar" id="enemyHP"></div></div>
  </div>
 </div>

 <div class="enemy">
  <div class="enemy-icon" id="enemyIcon">🥊</div>
  <div class="enemy-name">CYBER BOT</div>
 </div>

</div>

<div class="stats">
 <div class="stat">
  <small>SCORE</small><b id="score">0</b>
 </div>
 <div class="stat">
  <small>COMBO</small><b id="combo">0</b>
 </div>
 <div class="stat">
  <small>LAST MOVE</small><b id="move">READY</b>
 </div>
</div>

<div class="controls">
 <button onclick="startGame()">START GAME</button>
 <button class="stop" onclick="stopGame()">STOP</button>
</div>

<div class="message" id="message">
 Gerakkan tangan untuk mulai bertarung!
</div>

</div>

<script type="module">

import {
 HandLandmarker,
 FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let tracker,stream,running=false;
let previous=[];
let cooldown=[0,0];
let player=100,enemy=100;
let score=0,combo=0;
let lastHit=0,lastEnemyAttack=0;
let lastFrame=-1;
let gameEnded=false;

const $=id=>document.getElementById(id);

async function setupAI(){

 $("status").textContent="● LOADING AI";

 const vision=await FilesetResolver.forVisionTasks(
 "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
 );

 tracker=await HandLandmarker.createFromOptions(vision,{
  baseOptions:{
   modelAssetPath:
   "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
   delegate:"CPU"
  },
  runningMode:"VIDEO",
  numHands:2,
  minHandDetectionConfidence:.55,
  minHandPresenceConfidence:.5,
  minTrackingConfidence:.5
 });
}

async function startGame(){

 try{
  if(!tracker)await setupAI();

  stream=await navigator.mediaDevices.getUserMedia({
   audio:false,
   video:{
    facingMode:"user",
    width:{ideal:640},
    height:{ideal:480}
   }
  });

  video.srcObject=stream;
  await video.play();

  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;

  player=100;
  enemy=100;
  score=0;
  combo=0;
  previous=[];
  cooldown=[0,0];
  gameEnded=false;
  lastHit=0;
  lastEnemyAttack=Date.now();

  updateHUD();

  running=true;
  $("status").textContent="● SYSTEM ACTIVE";
  $("message").textContent="AYO! GERAKKAN TANGAN KAKA!";
  requestAnimationFrame(loop);

 }catch(e){
  console.error(e);
  $("status").textContent="● CAMERA ERROR";
  alert("Kamera tidak dapat dibuka. Gunakan HTTPS dan izinkan kamera.");
 }
}

function drawHand(points){

 const w=canvas.width;
 const h=canvas.height;

 // Kotak neon mengikuti tangan

 let minX=1,minY=1,maxX=0,maxY=0;

 points.forEach(p=>{
  minX=Math.min(minX,p.x);
  minY=Math.min(minY,p.y);
  maxX=Math.max(maxX,p.x);
  maxY=Math.max(maxY,p.y);
 });

 const pad=.035;
 minX=Math.max(0,minX-pad);
 minY=Math.max(0,minY-pad);
 maxX=Math.min(1,maxX+pad);
 maxY=Math.min(1,maxY+pad);

 ctx.strokeStyle="#bd5cff";
 ctx.lineWidth=3;
 ctx.shadowColor="#ad43ff";
 ctx.shadowBlur=18;
 ctx.strokeRect(
  minX*w,minY*h,
  (maxX-minX)*w,(maxY-minY)*h
 );

 // Titik tangan

 ctx.fillStyle="#00f6ff";
 ctx.shadowColor="#00f6ff";

 points.forEach(p=>{
  ctx.beginPath();
  ctx.arc(p.x*w,p.y*h,3,0,Math.PI*2);
  ctx.fill();
 });

 ctx.shadowBlur=0;

}

function loop(){

 if(!running)return;

 if(video.currentTime!==lastFrame&&video.readyState>=2){

  lastFrame=video.currentTime;

  const result=tracker.detectForVideo(video,performance.now());

  ctx.clearRect(0,0,canvas.width,canvas.height);

  const hands=result.landmarks;

  if(hands.length===0){
   $("move").textContent="SEARCH";
   previous=[];
  }

  hands.forEach((points,i)=>{

   drawHand(points);

   const wrist=points[0];
   const now=Date.now();

   if(!previous[i]){
    previous[i]={z:wrist.z,x:wrist.x,y:wrist.y};
    return;
   }

   const old=previous[i];

   // Deteksi gerakan tangan ke arah kamera
   const dz=wrist.z-old.z;

   // Deteksi pukulan dengan perubahan kedalaman
   if(dz<-.035 && now-cooldown[i]>550 && !gameEnded){

    cooldown[i]=now;
    punch(i);
   }

   previous[i]={
    z:old.z*.35+wrist.z*.65,
    x:wrist.x,
    y:wrist.y
   };

  });

  // Posisi bertahan: dua tangan berada di bagian bawah wajah
  if(hands.length>=2){
   const guarded=hands.every(p=>
    p[0].y<.75
   );
   if(guarded)$("move").textContent="GUARD";
  }

  enemyAttack();
 }

 requestAnimationFrame(loop);
}

function punch(hand){

 const now=Date.now();

 if(now-lastHit<1100)combo++;
 else combo=1;

 lastHit=now;

 const damage=8+Math.min(combo,5)*2;

 enemy=Math.max(0,enemy-damage);
 score+=100+combo*20;

 $("move").textContent=hand===0?"PUNCH 1":"PUNCH 2";

 $("enemyIcon").textContent="💥";

 setTimeout(()=>{
  if(!gameEnded)$("enemyIcon").textContent="🥊";
 },180);

 updateHUD();

 if(enemy<=0)endGame(true);

}

function enemyAttack(){

 const now=Date.now();

 if(now-lastEnemyAttack>3500&&!gameEnded){

  lastEnemyAttack=now;

  player=Math.max(0,player-8);

  $("message").textContent="CYBER BOT MENYERANG!";

  updateHUD();

  if(player<=0)endGame(false);
 }
}

function updateHUD(){

 $("playerHP").style.width=player+"%";
 $("enemyHP").style.width=enemy+"%";
 $("score").textContent=score;
 $("combo").textContent=combo;

}

function endGame(win){

 gameEnded=true;

 $("message").textContent=win?
 "🏆 KAKA MENANG! CYBER BOT KALAH!":
 "GAME OVER! COBA LAGI!";

 $("move").textContent=win?"WIN":"LOSE";
 $("enemyIcon").textContent=win?"🏆":"🤖";

}

function stopGame(){

 running=false;

 if(stream){
  stream.getTracks().forEach(t=>t.stop());
  stream=null;
 }

 video.srcObject=null;
 ctx.clearRect(0,0,canvas.width,canvas.height);

 $("status").textContent="● OFFLINE";
 $("message").textContent="GAME STOPPED";
 $("move").textContent="READY";

}

window.startGame=startGame;
window.stopGame=stopGame;

</script>
</body>
</html>
