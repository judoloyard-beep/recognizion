
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rasengan AR</title>

<style>
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  background: #050914;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
}
header {
  position: absolute;
  top: 18px;
  width: 100%;
  text-align: center;
  z-index: 5;
  pointer-events: none;
}
h1 {
  margin: 0;
  color: #76caff;
  letter-spacing: 5px;
  text-shadow: 0 0 20px #008cff;
}
header p {
  font-size: 11px;
  color: #a8dfff;
  letter-spacing: 3px;
}
#stage {
  position: relative;
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
  background: radial-gradient(#102a48, #050914);
}
video, canvas {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
}
canvas {
  z-index: 2;
}
#message {
  position: absolute;
  top: 48%;
  width: 100%;
  text-align: center;
  z-index: 3;
  color: #b8e8ff;
  font-size: 14px;
  text-shadow: 0 0 10px #008cff;
  pointer-events: none;
}
#controls {
  position: absolute;
  bottom: 28px;
  left: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 12px;
  z-index: 5;
}
button {
  border: 1px solid #56baff;
  border-radius: 30px;
  background: #092849dd;
  color: white;
  padding: 14px 20px;
  font-weight: bold;
  box-shadow: 0 0 18px #008cff55;
}
button:active {
  background: #0879c9;
}
#status {
  position: absolute;
  bottom: 95px;
  width: 100%;
  text-align: center;
  z-index: 5;
  color: #8bd8ff;
  font-size: 12px;
  letter-spacing: 2px;
}
</style>
</head>

<body>
<div id="stage">
  <header>
    <h1>RASENGAN</h1>
    <p>CHAKRA DETECTION SYSTEM</p>
  </header>

  <video id="camera" autoplay playsinline muted></video>
  <canvas id="fx"></canvas>

  <div id="message">
    AKTIFKAN KAMERA DAN TUNJUKKAN TANGAN
  </div>

  <div id="status">SYSTEM STANDBY</div>

  <div id="controls">
    <button id="start">AKTIFKAN KAMERA</button>
    <button id="switch">GANTI KAMERA</button>
  </div>
</div>

<script type="module">
import {
  HandLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14";

const video = document.getElementById("camera");
const canvas = document.getElementById("fx");
const ctx = canvas.getContext("2d");
const message = document.getElementById("message");
const status = document.getElementById("status");

let detector;
let stream;
let facing = "user";
let running = false;
let lastVideoTime = -1;
let handPosition = null;
let particles = [];

async function setupAI() {
  status.textContent = "LOADING CHAKRA SYSTEM...";

  const vision = await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  detector = await HandLandmarker.createFromOptions(vision, {
    baseOptions: {
      modelAssetPath:
      "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
      delegate: "GPU"
    },
    runningMode: "VIDEO",
    numHands: 2
  });

  status.textContent = "CHAKRA SYSTEM READY";
}

async function startCamera() {
  try {
    if (!detector) await setupAI();

    if (stream) {
      stream.getTracks().forEach(t => t.stop());
    }

    stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: {
        facingMode: facing,
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });

    video.srcObject = stream;
    await video.play();

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;

    running = true;
    message.style.display = "none";
    status.textContent = "SCANNING HAND...";
    document.getElementById("start").textContent = "MATIKAN KAMERA";

    requestAnimationFrame(loop);

  } catch (err) {
    status.textContent = "KAMERA GAGAL DIAKTIFKAN";
    message.style.display = "block";
    message.textContent = err.message;
  }
}

function distance(a, b) {
  return Math.hypot(a.x - b.x, a.y - b.y);
}

function isFist(hand) {
  const wrist = hand[0];
  const fingers = [8, 12, 16, 20];
  const joints = [6, 10, 14, 18];

  let curled = 0;

  for (let i = 0; i < 4; i++) {
    if (
      distance(hand[fingers[i]], wrist) <
      distance(hand[joints[i]], wrist)
    ) curled++;
  }

  return curled >= 3;
}

function createParticles(x, y, radius, time) {
  for (let i = 0; i < 3; i++) {
    const angle = Math.random() * Math.PI * 2;
    const r = radius * (0.8 + Math.random() * 1.5);

    particles.push({
      x: x + Math.cos(angle) * r,
      y: y + Math.sin(angle) * r,
      vx: Math.cos(angle) * (1 + Math.random() * 2),
      vy: Math.sin(angle) * (1 + Math.random() * 2),
      life: 1,
      size: 1 + Math.random() * 4
    });
  }
}

function drawRasengan(x, y, size, time, fist) {
  const radius = size * (fist ? 1.15 : 0.9);

  ctx.save();
  ctx.globalCompositeOperation = "lighter";

  // Cahaya luar
  const glow = ctx.createRadialGradient(
    x, y, 2, x, y, radius * 2.2
  );

  glow.addColorStop(0, "#ffffff");
  glow.addColorStop(0.2, "#69dcff");
  glow.addColorStop(0.5, "#087eff55");
  glow.addColorStop(1, "#0077ff00");

  ctx.fillStyle = glow;
  ctx.beginPath();
  ctx.arc(x, y, radius * 2.2, 0, Math.PI * 2);
  ctx.fill();

  // Bola chakra
  const ball = ctx.createRadialGradient(
    x - radius * 0.25,
    y - radius * 0.3,
    2,
    x, y, radius
  );

  ball.addColorStop(0, "#ffffff");
  ball.addColorStop(0.2, "#b9f5ff");
  ball.addColorStop(0.5, "#36baff");
  ball.addColorStop(0.85, "#0066ff");
  ball.addColorStop(1, "#001e88");

  ctx.fillStyle = ball;
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI * 2);
  ctx.fill();

  // Pusaran chakra
  for (let i = 0; i < 5; i++) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(time * (0.0015 + i * 0.00025) + i);

    ctx.strokeStyle = i % 2
      ? "#ffffff"
      : "#7deaff";

    ctx.lineWidth = 2 + i % 2;
    ctx.shadowBlur = 15;
    ctx.shadowColor = "#00aaff";

    ctx.beginPath();
    ctx.ellipse(
      0, 0,
      radius * (0.45 + i * 0.09),
      radius * (0.15 + i * 0.025),
      0, 0, Math.PI * 1.7
    );
    ctx.stroke();
    ctx.restore();
  }

  // Kilatan cahaya
  for (let i = 0; i < 8; i++) {
    const angle = time * 0.003 + i * Math.PI / 4;
    const r = radius * (1.1 + Math.sin(time * 0.005 + i) * 0.2);

    ctx.fillStyle = "#c8f6ff";
    ctx.shadowBlur = 15;
    ctx.shadowColor = "#00aaff";

    ctx.beginPath();
    ctx.arc(
      x + Math.cos(angle) * r,
      y + Math.sin(angle) * r,
      3, 0, Math.PI * 2
    );
    ctx.fill();
  }

  ctx.restore();

  createParticles(x, y, radius, time);
}

function drawParticles() {
  ctx.save();
  ctx.globalCompositeOperation = "lighter";

  particles.forEach(p => {
    p.x += p.vx;
    p.y += p.vy;
    p.life -= 0.018;

    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = "#78dfff";
    ctx.shadowBlur = 10;
    ctx.shadowColor = "#008cff";

    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });

  ctx.restore();
  particles = particles.filter(p => p.life > 0);
}

function loop(time) {
  if (!running) return;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  if (
    video.readyState >= 2 &&
    video.currentTime !== lastVideoTime
  ) {
    lastVideoTime = video.currentTime;

    const result = detector.detectForVideo(video, time);

    if (result.landmarks.length > 0) {
      const hand = result.landmarks[0];

      // Posisi tengah telapak tangan
      const palm = hand[9];
      const x = palm.x * canvas.width;
      const y = palm.y * canvas.height;

      // Ukuran bola mengikuti jarak tangan ke kamera
      const handSize = distance(hand[5], hand[17]);
      const size = Math.max(
        38,
        Math.min(100, handSize * canvas.width * 1.15)
      );

      const fist = isFist(hand);

      handPosition = { x, y, size, fist };

      status.textContent = fist
        ? "CHAKRA POWER: CHARGING!"
        : "RASENGAN DETECTED!";

    } else {
      handPosition = null;
      status.textContent = "SEARCHING FOR HAND...";
    }
  }

  if (handPosition) {
    drawRasengan(
      handPosition.x,
      handPosition.y,
      handPosition.size,
      time,
      handPosition.fist
    );
  }

  drawParticles();
  requestAnimationFrame(loop);
}

document.getElementById("start").onclick = () => {
  if (running) {
    running = false;
    if (stream) {
      stream.getTracks().forEach(t => t.stop());
      stream = null;
    }
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    handPosition = null;
    particles = [];
    video.srcObject = null;
    message.style.display = "block";
    message.textContent = "KAMERA DIMATIKAN";
    status.textContent = "SYSTEM STANDBY";
    document.getElementById("start").textContent = "AKTIFKAN KAMERA";
  } else {
    startCamera();
  }
};

document.getElementById("switch").onclick = async () => {
  facing = facing === "user" ? "environment" : "user";
  if (running) await startCamera();
};

</script>
</body>
</html>
