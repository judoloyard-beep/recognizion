
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Senko Particle Universe</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #03030b;
  color: white;
  font-family: Arial, sans-serif;
  overflow: hidden;
  height: 100dvh;
  touch-action: none;
}

#scene {
  position: fixed;
  inset: 0;
}

canvas {
  display: block;
}

#cameraBox {
  position: fixed;
  z-index: 5;
  top: 15px;
  right: 12px;
  width: 95px;
  height: 120px;
  border: 1px solid #995aff;
  border-radius: 13px;
  overflow: hidden;
  background: #080613;
  box-shadow: 0 0 18px #843aff44;
}

#camera {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
}

#camLabel {
  position: absolute;
  bottom: 0;
  width: 100%;
  padding: 5px;
  text-align: center;
  font-size: 8px;
  background: #080613cc;
  color: #d7bdff;
}

#status {
  position: fixed;
  z-index: 5;
  top: 20px;
  left: 14px;
  padding: 10px 14px;
  background: #100a20dd;
  border: 1px solid #7545b7;
  border-radius: 30px;
  color: #d9c3ff;
  font-size: 10px;
}

#control {
  position: fixed;
  z-index: 5;
  bottom: 22px;
  left: 50%;
  transform: translateX(-50%);
  width: min(90%,350px);
  padding: 12px;
  border-radius: 15px;
  background: #0b0919dd;
  border: 1px solid #513778;
  backdrop-filter: blur(15px);
}

#start {
  width: 100%;
  padding: 14px;
  border: 0;
  border-radius: 10px;
  background: linear-gradient(100deg,#6431bd,#a64cff);
  color: white;
  font-size: 12px;
  font-weight: bold;
  letter-spacing: 1px;
}

#info {
  text-align: center;
  font-size: 9px;
  color: #88809e;
  margin-top: 9px;
}

@media(max-height:600px) {
  #control {
    bottom: 8px;
    padding: 8px;
  }

  #cameraBox {
    width: 70px;
    height: 85px;
  }
}
</style>
</head>

<body>

<div id="scene"></div>

<div id="status">● UNIVERSE READY</div>

<div id="cameraBox">
  <video id="camera" autoplay playsinline muted></video>
  <div id="camLabel">CAMERA</div>
</div>

<div id="control">
  <button id="start">AKTIFKAN HAND TRACKING</button>
  <div id="info">Gerakkan tangan untuk mengendalikan universe</div>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">

import * as THREE from "three";

// =================================
// ELEMENTS
// =================================

const $ = id => document.getElementById(id);

const video = $("camera");
const status = $("status");
const startButton = $("start");

// =================================
// THREE JS
// =================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x03030b);

const camera = new THREE.PerspectiveCamera(
  55,
  innerWidth / innerHeight,
  0.1,
  100
);

camera.position.z = 12;

const renderer = new THREE.WebGLRenderer({
  antialias: false,
  alpha: false,
  powerPreference: "high-performance"
});

renderer.setPixelRatio(
  Math.min(devicePixelRatio,1)
);

renderer.setSize(innerWidth,innerHeight);

$("scene").appendChild(renderer.domElement);

// =================================
// UNIVERSE GROUP
// =================================

const universe = new THREE.Group();

scene.add(universe);

// =================================
// PARTICLE SYSTEM
// =================================

const COUNT = 950;

const positions = new Float32Array(COUNT*3);
const colors = new Float32Array(COUNT*3);

const geometry = new THREE.BufferGeometry();

geometry.setAttribute(
  "position",
  new THREE.BufferAttribute(positions,3)
);

geometry.setAttribute(
  "color",
  new THREE.BufferAttribute(colors,3)
);

const material = new THREE.PointsMaterial({
  size: 0.075,
  vertexColors: true,
  transparent: true,
  opacity: 0.95,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  sizeAttenuation: true
});

const particleSystem = new THREE.Points(
  geometry,
  material
);

universe.add(particleSystem);

// =================================
// RANDOM SPHERE
// =================================

function randomSphere(radius) {

  const theta = Math.random()*Math.PI*2;
  const z = Math.random()*2-1;

  const r = radius*Math.cbrt(Math.random());

  const s = Math.sqrt(1-z*z);

  return [
    r*s*Math.cos(theta),
    r*s*Math.sin(theta),
    r*z
  ];
}

// =================================
// COLOR
// =================================

const colorA = new THREE.Color(0x8546ff);
const colorB = new THREE.Color(0x32caff);
const colorC = new THREE.Color(0xffb44a);
const colorD = new THREE.Color(0xff4cba);

function putColor(index,color) {

  const factor = 0.65+Math.random()*0.35;

  colors[index*3] = color.r*factor;
  colors[index*3+1] = color.g*factor;
  colors[index*3+2] = color.b*factor;
}

// =================================
// PLANET GENERATOR
// =================================

function addPlanet(index,center,radius,color) {

  const p = randomSphere(radius);

  positions[index*3] = p[0]+center[0];
  positions[index*3+1] = p[1]+center[1];
  positions[index*3+2] = p[2]+center[2];

  putColor(index,color);
}

// =================================
// RING GENERATOR
// =================================

function addRing(index,center,inner,outer,color,tilt=0) {

  const angle = Math.random()*Math.PI*2;

  const r = inner+Math.random()*(outer-inner);

  const y = (Math.random()-0.5)*0.12;

  const x = Math.cos(angle)*r;
  const z = Math.sin(angle)*r;

  positions[index*3] = center[0]+x;
  positions[index*3+1] = center[1]+y*Math.cos(tilt)-z*Math.sin(tilt);
  positions[index*3+2] = center[2]+y*Math.sin(tilt)+z*Math.cos(tilt);

  putColor(index,color);
}

// =================================
// BUILD UNIVERSE
// =================================

function buildUniverse() {

  for(let i=0;i<COUNT;i++) {

    const ratio = i/COUNT;

    // PLANET 1
    if(ratio<0.34) {

      addPlanet(
        i,
        [0,0,0],
        1.05,
        colorA
      );

    }

    // RING 1
    else if(ratio<0.53) {

      addRing(
        i,
        [0,0,0],
        1.35,
        2.05,
        colorB,
        0.15
      );

    }

    // PLANET 2
    else if(ratio<0.66) {

      addPlanet(
        i,
        [2.35,0.8,0],
        0.48,
        colorC
      );

    }

    // PLANET 3
    else if(ratio<0.77) {

      addPlanet(
        i,
        [-2.3,-0.7,0],
        0.38,
        colorD
      );

    }

    // PLANET 4
    else if(ratio<0.86) {

      addPlanet(
        i,
        [0.7,-2.1,0],
        0.32,
        colorB
      );

    }

    // RING 2
    else if(ratio<0.94) {

      addRing(
        i,
        [2.35,0.8,0],
        0.55,
        0.85,
        colorD,
        0.5
      );

    }

    // SMALL COSMIC PARTICLES
    else {

      const p = randomSphere(3.0);

      positions[i*3] = p[0];
      positions[i*3+1] = p[1];
      positions[i*3+2] = p[2];

      putColor(i,colorB);
    }
  }

  geometry.attributes.position.needsUpdate = true;
  geometry.attributes.color.needsUpdate = true;
}

buildUniverse();

// =================================
// BACKGROUND STARS
// =================================

const starPositions = [];

for(let i=0;i<350;i++) {

  starPositions.push(
    (Math.random()-0.5)*35,
    (Math.random()-0.5)*25,
    -5-Math.random()*15
  );
}

const starGeometry = new THREE.BufferGeometry();

starGeometry.setAttribute(
  "position",
  new THREE.Float32BufferAttribute(starPositions,3)
);

const starMaterial = new THREE.PointsMaterial({
  color: 0x8d76ff,
  size: 0.045,
  transparent: true,
  opacity: 0.65
});

const stars = new THREE.Points(
  starGeometry,
  starMaterial
);

scene.add(stars);

// =================================
// HAND TRACKING STATE
// =================================

let landmarker = null;
let stream = null;
let tracking = false;

let handDetected = false;

let targetX = 0;
let targetY = 0;

let currentX = 0;
let currentY = 0;

let targetScale = 1;
let currentScale = 1;

let lastDetection = 0;
let lastVideoTime = -1;

// =================================
// SCREEN BOUNDS
// =================================

function getScreenBounds() {

  const distance = camera.position.z;

  const visibleHeight =
    2*Math.tan(THREE.MathUtils.degToRad(camera.fov/2))*distance;

  const visibleWidth =
    visibleHeight*camera.aspect;

  return {
    x: Math.max(0,visibleWidth/2-3.0),
    y: Math.max(0,visibleHeight/2-3.0)
  };
}

// =================================
// HAND POSITION
// =================================

function updateHand(lm) {

  // palm center, more stable than wrist alone

  const palmX = (
    lm[0].x+
    lm[5].x+
    lm[9].x+
    lm[13].x+
    lm[17].x
  )/5;

  const palmY = (
    lm[0].y+
    lm[5].y+
    lm[9].y+
    lm[13].y+
    lm[17].y
  )/5;

  const bounds = getScreenBounds();

  // mirrored camera coordinates

  const normalizedX = (0.5-palmX)*2;
  const normalizedY = (0.5-palmY)*2;

  // limit movement so the object stays visible

  targetX = THREE.MathUtils.clamp(
    normalizedX*bounds.x,
    -bounds.x,
    bounds.x
  );

  targetY = THREE.MathUtils.clamp(
    normalizedY*bounds.y,
    -bounds.y,
    bounds.y
  );

  // palm size controls scale gently

  const palmWidth = Math.hypot(
    lm[5].x-lm[17].x,
    lm[5].y-lm[17].y
  );

  targetScale = THREE.MathUtils.clamp(
    0.8+(palmWidth-0.12)*0.8,
    0.78,
    1.08
  );

  handDetected = true;
}

// =================================
// MEDIAPIPE
// =================================

async function startTracking() {

  if(!navigator.mediaDevices?.getUserMedia) {

    status.textContent = "HTTPS DIPERLUKAN";
    return;
  }

  startButton.disabled = true;
  startButton.textContent = "MEMUAT KAMERA...";

  try {

    stream = await navigator.mediaDevices.getUserMedia({

      audio: false,

      video: {
        facingMode: "user",
        width: {ideal:320},
        height: {ideal:240},
        frameRate: {ideal:15,max:20}
      }
    });

    video.srcObject = stream;

    await video.play();

    const vision = await import(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14"
    );

    const fileset =
      await vision.FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );

    const options = {

      baseOptions: {
        modelAssetPath:
        "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate: "GPU"
      },

      runningMode: "VIDEO",
      numHands: 1,

      minHandDetectionConfidence: 0.55,
      minHandPresenceConfidence: 0.55,
      minTrackingConfidence: 0.55
    };

    try {

      landmarker =
        await vision.HandLandmarker.createFromOptions(
          fileset,
          options
        );

    } catch(error) {

      console.warn("GPU tidak tersedia, mencoba CPU");

      options.baseOptions.delegate = "CPU";

      landmarker =
        await vision.HandLandmarker.createFromOptions(
          fileset,
          options
        );
    }

    tracking = true;

    status.textContent = "● HAND TRACKING ACTIVE";

    $("camLabel").textContent = "ACTIVE";

    startButton.textContent = "KAMERA AKTIF";

    requestAnimationFrame(trackHands);

  } catch(error) {

    console.error(error);

    status.textContent = "GAGAL MEMUAT KAMERA";

    startButton.disabled = false;
    startButton.textContent = "COBA LAGI";

    if(stream) {
      stream.getTracks().forEach(t=>t.stop());
      stream = null;
    }
  }
}

// =================================
// DETECTION LOOP
// =================================

function trackHands(now) {

  if(!tracking) return;

  requestAnimationFrame(trackHands);

  // detection limited to 10 FPS

  if(now-lastDetection<100) return;

  if(video.readyState<2) return;

  if(video.currentTime===lastVideoTime) return;

  lastDetection = now;
  lastVideoTime = video.currentTime;

  try {

    const result = landmarker.detectForVideo(
      video,
      now
    );

    if(result.landmarks?.length) {

      const lm = result.landmarks[0];

      updateHand(lm);

      status.textContent = "● TANGAN TERDETEKSI";

    } else {

      handDetected = false;

      // keep the last known position
      // do not reset universe to zero

      status.textContent = "● MENUNGGU TANGAN...";
    }

  } catch(error) {

    console.warn(error);

  }
}

startButton.addEventListener(
  "click",
  startTracking
);

// =================================
// ANIMATION
// =================================

const clock = new THREE.Clock();

function animate() {

  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(),0.04);

  const elapsed = clock.elapsedTime;

  // frame-rate independent smoothing

  const follow = 1-Math.exp(-dt*5);

  currentX += (targetX-currentX)*follow;
  currentY += (targetY-currentY)*follow;

  currentScale +=
    (targetScale-currentScale)*follow;

  // move universe smoothly

  universe.position.x = currentX;
  universe.position.y = currentY;

  universe.scale.setScalar(currentScale);

  // stable rotation, no random tilting

  universe.rotation.y = elapsed*0.12;

  universe.rotation.x = 0.08;

  universe.rotation.z = 0;

  // background movement

  stars.rotation.y += dt*0.012;

  stars.rotation.x =
    Math.sin(elapsed*0.1)*0.015;

  renderer.render(scene,camera);
}

animate();

// =================================
// RESIZE
// =================================

window.addEventListener("resize",()=>{

  camera.aspect = innerWidth/innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    innerWidth,
    innerHeight
  );

  renderer.setPixelRatio(
    Math.min(devicePixelRatio,1)
  );

  // clamp the existing position after resize

  const bounds = getScreenBounds();

  targetX = THREE.MathUtils.clamp(
    targetX,-bounds.x,bounds.x
  );

  targetY = THREE.MathUtils.clamp(
    targetY,-bounds.y,bounds.y
  );

});

// =================================
// CLEANUP
// =================================

window.addEventListener("pagehide",()=>{

  tracking = false;

  if(stream) {
    stream.getTracks().forEach(t=>t.stop());
  }

  if(landmarker) {
    landmarker.close();
  }

  geometry.dispose();
  material.dispose();
  starGeometry.dispose();
  starMaterial.dispose();

  renderer.dispose();

});

</script>

</body>
</html>
