
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Senko Universe V5</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
 background:#03030b;
 color:white;
 font-family:Arial,sans-serif;
 overflow:hidden;
 height:100dvh;
}

#scene{position:fixed;inset:0}
canvas{display:block}

header{
 position:absolute;
 top:17px;
 width:100%;
 text-align:center;
 pointer-events:none;
 z-index:3;
}

header h1{
 font-size:19px;
 letter-spacing:4px;
 color:#e5d5ff;
 text-shadow:0 0 15px #a34dff;
}

header p{
 font-size:9px;
 letter-spacing:3px;
 margin-top:6px;
 color:#8980ac;
}

#status{
 position:absolute;
 top:85px;
 left:50%;
 transform:translateX(-50%);
 z-index:4;
 padding:9px 16px;
 border:1px solid #7545b7;
 border-radius:30px;
 background:#110b24ee;
 color:#d5baff;
 font-size:10px;
 white-space:nowrap;
}

#cameraBox{
 position:absolute;
 z-index:4;
 top:15px;
 right:12px;
 width:92px;
 height:115px;
 border:1px solid #995aff;
 border-radius:12px;
 overflow:hidden;
 background:#111;
}

#camera{
 width:100%;
 height:100%;
 object-fit:cover;
 transform:scaleX(-1);
}

#camLabel{
 position:absolute;
 bottom:0;
 width:100%;
 padding:5px;
 text-align:center;
 font-size:8px;
 background:#080613cc;
 color:#d7bdff;
}

#panel{
 position:absolute;
 z-index:5;
 bottom:14px;
 left:50%;
 transform:translateX(-50%);
 width:min(94%,440px);
 padding:13px;
 border-radius:18px;
 background:#0b0919ee;
 border:1px solid #513778;
 backdrop-filter:blur(15px);
}

#gesture{
 text-align:center;
 font-size:11px;
 color:#d6baff;
 margin-bottom:11px;
}

.buttons{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:7px;
}

button{
 color:white;
 background:#19132b;
 border:1px solid #493368;
 padding:11px 3px;
 border-radius:10px;
 font-size:10px;
}

button.active{
 background:linear-gradient(135deg,#7138bb,#a14cff);
 border-color:#d3a8ff;
}

#start{
 width:100%;
 margin-top:10px;
 padding:13px;
 background:linear-gradient(90deg,#6431bd,#a64cff);
 border:0;
 font-weight:bold;
 letter-spacing:1px;
}

#start:disabled{opacity:.7}

#hint{
 text-align:center;
 font-size:9px;
 color:#77718e;
 margin-top:9px;
}

@media(max-height:620px){
 header{top:7px}
 #status{top:48px}
 #panel{bottom:5px;padding:8px}
 #cameraBox{width:65px;height:80px}
 button{padding:8px 2px}
}
</style>
</head>

<body>

<div id="scene"></div>

<header>
 <h1>SENKO UNIVERSE</h1>
 <p>HAND INTERACTIVE EXPERIENCE V5</p>
</header>

<div id="status">✦ UNIVERSE READY</div>

<div id="cameraBox">
 <video id="camera" autoplay playsinline muted></video>
 <div id="camLabel">CAMERA OFF</div>
</div>

<div id="panel">

 <div id="gesture">✋ Siap mendeteksi tangan</div>

 <div class="buttons">
  <button data-mode="1" class="active">🌌 SPACE</button>
  <button data-mode="2">🪐 SATURN</button>
  <button data-mode="3">💙 LOVE</button>
  <button data-mode="4">💗 HEART</button>
 </div>

 <button id="start">✦ AKTIFKAN KAMERA</button>

 <div id="hint">
  Telapak: Space · Telunjuk: Saturn · Peace: Love · Genggam: Heart
 </div>

</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
 }
}
</script>

<script type="module">

import * as THREE from "three";

// =================================
// ELEMENTS
// =================================

const $ = id => document.getElementById(id);

const video = $("camera");
const status = $("status");
const gesture = $("gesture");
const startButton = $("start");

// =================================
// STATE
// =================================

const COUNT = 750;

let mode = 1;
let tracking = false;
let starting = false;

let stream = null;
let landmarker = null;

let handDetected = false;

let handX = 0;
let handY = 0;
let handScale = 1;

let targetX = 0;
let targetY = 0;

let lastDetection = 0;
let lastVideoTime = -1;

let candidateMode = 1;
let candidateCount = 0;

const palette = {
  1:0x428aff,
  2:0xffa63b,
  3:0x16dfff,
  4:0xff267b
};

// =================================
// THREE JS
// =================================

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x03030b);

const camera = new THREE.PerspectiveCamera(
  55,
  innerWidth/innerHeight,
  0.1,
  100
);

camera.position.z = 11;

const renderer = new THREE.WebGLRenderer({
  antialias:false,
  powerPreference:"high-performance"
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1));

$("scene").appendChild(renderer.domElement);

const universe = new THREE.Group();
scene.add(universe);

// =================================
// PARTICLE TARGETS
// =================================

let geometry;
let material;
let particles;

let colors;
let targets = {};

function spherePoint(radius){

 const theta=Math.random()*Math.PI*2;
 const z=Math.random()*2-1;
 const r=radius*Math.cbrt(Math.random());
 const s=Math.sqrt(1-z*z);

 return [
  r*s*Math.cos(theta),
  r*s*Math.sin(theta),
  r*z
 ];
}

function generateTargets(){

 const space=new Float32Array(COUNT*3);
 const saturn=new Float32Array(COUNT*3);
 const heart=new Float32Array(COUNT*3);
 const love=new Float32Array(COUNT*3);

 const canvas=document.createElement("canvas");
 canvas.width=1000;
 canvas.height=250;

 const ctx=canvas.getContext("2d");

 ctx.fillStyle="white";
 ctx.font="bold 135px Arial";
 ctx.textAlign="center";
 ctx.textBaseline="middle";
 ctx.fillText("I LOVE YOU",500,125);

 const pixels=ctx.getImageData(0,0,1000,250).data;
 const points=[];

 for(let y=0;y<250;y+=2){
  for(let x=0;x<1000;x+=2){
   if(pixels[(y*1000+x)*4+3]>100){
    points.push([x,y]);
   }
  }
 }

 for(let i=0;i<COUNT;i++){

  let p=spherePoint(3.5);
  space.set(p,i*3);

  if(i<COUNT*.65){
   p=spherePoint(1.2);
  }else{
   const a=Math.random()*Math.PI*2;
   const r=1.7+Math.random()*1.6;

   p=[
    Math.cos(a)*r,
    (Math.random()-.5)*.07,
    Math.sin(a)*r
   ];
  }

  saturn.set(p,i*3);

  const t=Math.random()*Math.PI*2;
  const scale=Math.sqrt(Math.random());

  const hx=16*Math.pow(Math.sin(t),3);

  const hy=
   13*Math.cos(t)
   -5*Math.cos(2*t)
   -2*Math.cos(3*t)
   -Math.cos(4*t);

  heart.set([
   hx*scale*.15,
   hy*scale*.15,
   (Math.random()-.5)*.6
  ],i*3);

  const point=points[
   Math.floor(Math.random()*points.length)
  ];

  love.set([
   (point[0]-500)*.008,
   (125-point[1])*.008,
   (Math.random()-.5)*.12
  ],i*3);
 }

 targets={space,saturn,heart,love};

 return space;
}

// =================================
// CREATE PARTICLES
// =================================

function createParticles(){

 const initial=generateTargets();

 const positions=new Float32Array(initial);
 colors=new Float32Array(COUNT*3);

 geometry=new THREE.BufferGeometry();

 geometry.setAttribute(
  "position",
  new THREE.BufferAttribute(positions,3)
 );

 geometry.setAttribute(
  "color",
  new THREE.BufferAttribute(colors,3)
 );

 material=new THREE.PointsMaterial({
  size:.065,
  vertexColors:true,
  transparent:true,
  opacity:.95,
  blending:THREE.AdditiveBlending,
  depthWrite:false
 });

 particles=new THREE.Points(geometry,material);
 universe.add(particles);

 updateColors();
}

// =================================
// STARS
// =================================

const starPositions=[];

for(let i=0;i<350;i++){
 starPositions.push(
  (Math.random()-.5)*35,
  (Math.random()-.5)*25,
  -5-Math.random()*15
 );
}

const starGeometry=new THREE.BufferGeometry();

starGeometry.setAttribute(
 "position",
 new THREE.Float32BufferAttribute(starPositions,3)
);

const stars=new THREE.Points(
 starGeometry,
 new THREE.PointsMaterial({
  color:0x8a6dff,
  size:.045,
  transparent:true,
  opacity:.7
 })
);

scene.add(stars);

// =================================
// COLOR
// =================================

function updateColors(){

 const base=new THREE.Color(palette[mode]);

 for(let i=0;i<COUNT;i++){

  const factor=.65+Math.random()*.35;

  const color=mode===2 && i>=COUNT*.65
   ?new THREE.Color(0xffc06a)
   :base;

  colors[i*3]=color.r*factor;
  colors[i*3+1]=color.g*factor;
  colors[i*3+2]=color.b*factor;
 }

 geometry.attributes.color.needsUpdate=true;
}

// =================================
// EXPLOSION
// =================================

const BURST=150;

const burstPositions=new Float32Array(BURST*3);
const burstVelocity=new Float32Array(BURST*3);

const burstGeometry=new THREE.BufferGeometry();

burstGeometry.setAttribute(
 "position",
 new THREE.BufferAttribute(burstPositions,3)
);

const burstMaterial=new THREE.PointsMaterial({
 color:0xd5a1ff,
 size:.08,
 transparent:true,
 opacity:0,
 blending:THREE.AdditiveBlending,
 depthWrite:false
});

const burst=new THREE.Points(burstGeometry,burstMaterial);
universe.add(burst);

let burstLife=0;

function explode(){

 burstLife=1;

 for(let i=0;i<BURST;i++){

  const a=Math.random()*Math.PI*2;
  const z=Math.random()*2-1;
  const r=Math.sqrt(1-z*z);

  const speed=2+Math.random()*5;

  burstPositions[i*3]=0;
  burstPositions[i*3+1]=0;
  burstPositions[i*3+2]=0;

  burstVelocity[i*3]=Math.cos(a)*r*speed;
  burstVelocity[i*3+1]=Math.sin(a)*r*speed;
  burstVelocity[i*3+2]=z*speed;
 }

 burstGeometry.attributes.position.needsUpdate=true;
}

// =================================
// MODE
// =================================

const names={
 1:"COSMIC UNIVERSE",
 2:"SATURN 3D",
 3:"I LOVE YOU",
 4:"HEART 3D"
};

const targetNames={
 1:"space",
 2:"saturn",
 3:"love",
 4:"heart"
};

function setMode(next){

 if(next===mode)return;

 mode=next;

 updateColors();
 explode();

 status.textContent="✦ "+names[mode];

 document.querySelectorAll("[data-mode]").forEach(btn=>{
  btn.classList.toggle(
   "active",
   Number(btn.dataset.mode)===mode
  );
 });
}

document.querySelectorAll("[data-mode]").forEach(btn=>{
 btn.addEventListener("click",()=>{
  setMode(Number(btn.dataset.mode));
 });
});

// =================================
// GESTURE
// =================================

function detectGesture(lm){

 const tips=[8,12,16,20];
 const pips=[6,10,14,18];

 const fingers=tips.map((tip,i)=>{
  return lm[tip].y<lm[pips[i]].y;
 });

 if(fingers.every(v=>!v))return 4;

 if(fingers[0]&&!fingers[1]&&!fingers[2]&&!fingers[3])return 2;

 if(fingers[0]&&fingers[1]&&!fingers[2]&&!fingers[3])return 3;

 if(fingers.every(v=>v))return 1;

 return mode;
}

// =================================
// CAMERA ERROR MESSAGES
// =================================

function cameraError(error){

 console.error("CAMERA ERROR:",error);

 const messages={
  NotAllowedError:"IZIN KAMERA DITOLAK",
  PermissionDeniedError:"IZIN KAMERA DITOLAK",
  NotFoundError:"KAMERA TIDAK DITEMUKAN",
  NotReadableError:"KAMERA SEDANG DIPAKAI APLIKASI LAIN",
  OverconstrainedError:"PENGATURAN KAMERA TIDAK DIDUKUNG",
  SecurityError:"BUKA MELALUI HTTPS"
 };

 return messages[error.name] ||
  ("KAMERA ERROR: "+error.message);
}

function stopCamera(){

 tracking=false;
 handDetected=false;

 if(stream){
  stream.getTracks().forEach(track=>track.stop());
  stream=null;
 }

 video.srcObject=null;

 if(landmarker){
  landmarker.close();
  landmarker=null;
 }

 $("camLabel").textContent="CAMERA OFF";
 gesture.textContent="✋ Kamera dihentikan";

 status.textContent="✦ CAMERA STOPPED";

 startButton.textContent="✦ AKTIFKAN KAMERA";
 startButton.disabled=false;
}

// =================================
// START CAMERA
// =================================

async function startTracking(){

 if(starting)return;

 if(tracking){
  stopCamera();
  return;
 }

 // CHECK SECURE CONTEXT

 if(!window.isSecureContext ||
    !navigator.mediaDevices ||
    !navigator.mediaDevices.getUserMedia){

  status.textContent="BUKA MELALUI HTTPS";

  gesture.textContent=
   "Gunakan Chrome dengan alamat HTTPS atau localhost";

  return;
 }

 starting=true;
 startButton.disabled=true;
 startButton.textContent="MEMBUKA KAMERA...";

 try{

  // 1. CAMERA PERMISSION

  status.textContent="✦ MEMINTA IZIN KAMERA";

  try{

   stream=await navigator.mediaDevices.getUserMedia({
    audio:false,
    video:{
     facingMode:{ideal:"user"},
     width:{ideal:320},
     height:{ideal:240},
     frameRate:{ideal:20}
    }
   });

  }catch(firstError){

   console.warn("Mencoba konfigurasi kamera alternatif",firstError);

   // FALLBACK CAMERA

   stream=await navigator.mediaDevices.getUserMedia({
    audio:false,
    video:true
   });
  }

  video.srcObject=stream;

  await new Promise((resolve,reject)=>{

   if(video.readyState>=2){
    resolve();
    return;
   }

   video.onloadedmetadata=()=>resolve();

   video.onerror=()=>reject(
    new Error("Video kamera gagal dimuat")
   );

  });

  await video.play();

  $("camLabel").textContent="CAMERA ON";

  status.textContent="✦ KAMERA AKTIF";

  // 2. LOAD MEDIAPIPE

  gesture.textContent="Memuat AI hand tracking...";

  startButton.textContent="MEMUAT AI...";

  const vision=await import(
   "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14"
  );

  const fileset=await vision.FilesetResolver.forVisionTasks(
   "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
  );

  const options={
   baseOptions:{
    modelAssetPath:
    "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
    delegate:"GPU"
   },
   runningMode:"VIDEO",
   numHands:1,
   minHandDetectionConfidence:.5,
   minHandPresenceConfidence:.5,
   minTrackingConfidence:.5
  };

  // 3. GPU THEN CPU

  try{

   landmarker=await vision.HandLandmarker.createFromOptions(
    fileset,
    options
   );

  }catch(gpuError){

   console.warn("GPU gagal, mencoba CPU",gpuError);

   options.baseOptions.delegate="CPU";

   landmarker=await vision.HandLandmarker.createFromOptions(
    fileset,
    options
   );
  }

  // 4. START TRACKING

  tracking=true;
  handDetected=false;

  status.textContent="✦ HAND TRACKING ACTIVE";

  gesture.textContent="Arahkan telapak ke kamera";

  startButton.textContent="✦ MATIKAN KAMERA";
  startButton.disabled=false;

  requestAnimationFrame(trackHands);

 }catch(error){

  console.error(error);

  const message=cameraError(error);

  status.textContent=message;

  gesture.textContent=
   "Periksa izin kamera dan koneksi internet";

  if(stream){
   stream.getTracks().forEach(track=>track.stop());
   stream=null;
  }

  video.srcObject=null;

  if(landmarker){
   landmarker.close();
   landmarker=null;
  }

  $("camLabel").textContent="CAMERA ERROR";

  startButton.textContent="COBA LAGI";
  startButton.disabled=false;

 }finally{

  starting=false;

 }
}

// =================================
// TRACKING LOOP
// =================================

function trackHands(now){

 if(!tracking)return;

 requestAnimationFrame(trackHands);

 if(now-lastDetection<50)return;

 if(video.readyState<2)return;

 if(video.currentTime===lastVideoTime)return;

 lastDetection=now;
 lastVideoTime=video.currentTime;

 try{

  const result=landmarker.detectForVideo(video,now);

  if(result.landmarks?.length){

   const lm=result.landmarks[0];

   handDetected=true;

   // GESTURE

   const detected=detectGesture(lm);

   if(detected===candidateMode){
    candidateCount++;
   }else{
    candidateMode=detected;
    candidateCount=0;
   }

   if(candidateCount>=3){
    setMode(detected);
   }

   // PALM CENTER

   const palm=lm[9];

   const rawX=(.5-palm.x)*8;
   const rawY=(.5-palm.y)*6;

   const palmWidth=Math.hypot(
    lm[5].x-lm[17].x,
    lm[5].y-lm[17].y
   );

   const wantedScale=THREE.MathUtils.clamp(
    .11/(palmWidth+.001),
    .65,
    1.1
   );

   handScale+=(wantedScale-handScale)*.12;

   targetX=rawX;
   targetY=rawY;

   const label={
    1:"✋ TELAPAK | SPACE",
    2:"☝️ TELUNJUK | SATURN",
    3:"✌️ PEACE | LOVE",
    4:"✊ GENGGAM | HEART"
   };

   gesture.textContent=label[detected];

   status.textContent="✦ HAND DETECTED";

  }else{

   // HOLD LAST POSITION

   handDetected=false;
   candidateCount=0;

   gesture.textContent="MENUNGGU TANGAN...";
   status.textContent="✦ SEARCHING HAND";

  }

 }catch(error){

  console.warn("Detection error",error);

 }
}

// =================================
// SAFE SCREEN LIMIT
// =================================

function fitScale(){

 const height=2*camera.position.z*
  Math.tan(THREE.MathUtils.degToRad(55/2));

 const width=height*camera.aspect;

 return THREE.MathUtils.clamp(
  Math.min(1,(width-.5)/7.6,(height-.5)/7.6),
  .35,
  1
 );
}

function screenLimits(scale){

 const height=2*camera.position.z*
  Math.tan(THREE.MathUtils.degToRad(55/2));

 const width=height*camera.aspect;

 return{
  x:Math.max(0,width/2-3.8*scale-.2),
  y:Math.max(0,height/2-3.8*scale-.2)
 };
}

// =================================
// ANIMATION
// =================================

const clock=new THREE.Clock();

function animate(){

 requestAnimationFrame(animate);

 const dt=Math.min(clock.getDelta(),.04);
 const elapsed=clock.elapsedTime;

 const current=geometry.attributes.position.array;
 const target=targets[targetNames[mode]];

 const smooth=1-Math.pow(.001,dt);

 for(let i=0;i<COUNT;i++){

  const j=i*3;

  current[j]+=(target[j]-current[j])*smooth;
  current[j+1]+=(target[j+1]-current[j+1])*smooth;
  current[j+2]+=(target[j+2]-current[j+2])*smooth;
 }

 geometry.attributes.position.needsUpdate=true;

 // KEEP OBJECT INSIDE SCREEN

 const scale=Math.min(handScale,fitScale());

 universe.scale.setScalar(scale);

 if(handDetected){

  const limits=screenLimits(scale);

  const safeX=THREE.MathUtils.clamp(
   targetX,-limits.x,limits.x
  );

  const safeY=THREE.MathUtils.clamp(
   targetY,-limits.y,limits.y
  );

  const follow=1-Math.pow(.001,dt);

  handX+=(safeX-handX)*follow;
  handY+=(safeY-handY)*follow;

  universe.position.x=handX;
  universe.position.y=handY;
 }

 // ROTATION

 universe.rotation.y+=dt*(mode===2?1.0:.3);

 if(mode===2){
  universe.rotation.x=.35;
  universe.rotation.z=.1;
 }else{
  universe.rotation.x=Math.sin(elapsed*.3)*.08;
  universe.rotation.z=0;
 }

 // EXPLOSION

 if(burstLife>0){

  burstLife-=dt*1.5;

  for(let i=0;i<BURST;i++){

   const j=i*3;

   burstPositions[j]+=burstVelocity[j]*dt;
   burstPositions[j+1]+=burstVelocity[j+1]*dt;
   burstPositions[j+2]+=burstVelocity[j+2]*dt;
  }

  burstGeometry.attributes.position.needsUpdate=true;

  burstMaterial.opacity=Math.max(0,burstLife);

 }else{

  burstMaterial.opacity=0;

 }

 stars.rotation.y+=dt*.015;

 renderer.render(scene,camera);
}

// =================================
// INITIALIZE
// =================================

createParticles();
animate();

// =================================
// BUTTON
// =================================

startButton.addEventListener("click",startTracking);

// =================================
// RESIZE
// =================================

window.addEventListener("resize",()=>{

 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();

 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1));

});

// =================================
// CLEANUP
// =================================

window.addEventListener("pagehide",()=>{

 tracking=false;

 if(stream){
  stream.getTracks().forEach(track=>track.stop());
 }

 if(landmarker){
  landmarker.close();
 }

});

</script>

</body>
</html>
